    terms_url: https://github.com/cisagov/CSAF
    automated_access: Permitted; public git repository cloned with git.
  ghsa:
    name: GitHub Advisory Database (github/advisory-database)
    url: https://github.com/github/advisory-database
    data_url: https://github.com/github/advisory-database.git
