# Authored seed catalogue. assemble.py joins it with the resolution scripts' results to write
# data/calibration/respondent_spread/{seeds,resolutions,sources}.yaml.
# Evidence text states only what the source is and how it records events, as known before each seed's
# information date. Each history table is computed by the source's script and covers only periods ending by the
# information date: git sources are read at the last commit on or before it; sources that post records after the
# recorded date stop one month before it (two for NHTSA SGO); other sources are dated by their own publication
# event and read from the current snapshot, so their histories can include later revisions. The snapshot and
# replacement rules below are copied into the generated seed contract.

retrieval_date: '2026-11-02'
latest_training_cutoff: '2026-06-30'
snapshot_rule: >-
  Each primary, control and secondary seed uses the value the named source records on the catalogue retrieval date.
  The snapshot SHA-256 identifies the retrieved source state; a later rerun may differ after late postings,
  rejections, withdrawals, corrections or index changes.
replacement_rule: >-
  No seed is replaced after collection starts. If a seed cannot be resolved by its frozen script, it remains
  unresolved; because resolved_outcomes requires a value for every seed, fitting cannot run until the seed is
  resolved by that same frozen script.
# Robustness diagnostics; neither changes the fitted k or its status.
# Super-blocks group primary blocks that share weaker common drivers across blocks (see the package README,
# "Known weaknesses"): the fit also reports a bootstrap range that resamples whole super-blocks.
super_blocks:
  VULN: [V-KEV, V-CVE, V-ICS, V-GHSA, X-EDB]
  SUPPLY: [S-MAL, C-DEFI]
  BREACH: [B-NOTICE, B-SEC]
  FEDERAL: [G-FR, G-DOJ, G-SECLIT, G-OFAC, F-CFPB, M-FDA]
  VEHICLE: [D-SGO, D-NHTSA]
  RESEARCH: [E-ARXIV]
# Seeds whose counts depend on a curator's later additions or batch postings; the fit also reports k without them.
curation_sensitive_seed_ids:
  - defihacklabs-incidents-2026q3
  - exploitdb-additions-2026q3
  - osv-mal-npm-2026q3
  - osv-mal-pypi-2026q3
  - osv-mal-crates-2026q3

sources:
  cisa_kev:
    name: CISA Known Exploited Vulnerabilities catalog (JSON feed)
    url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    data_url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    history_url: https://github.com/cisagov/kev-data
    script: cisa_kev.py
    terms: >-
      U.S. Government work published as a machine-readable feed; CISA's GitHub mirror (cisagov/kev-data), used for
      the pre-cutoff history vintage, states that the KEV database is distributed under CC0 1.0.
    terms_url: https://github.com/cisagov/kev-data/blob/main/LICENSE
    automated_access: Permitted; the JSON feed is provided for automated download.
  nvd:
    name: NIST National Vulnerability Database, CVE API 2.0
    url: https://nvd.nist.gov/developers/vulnerabilities
