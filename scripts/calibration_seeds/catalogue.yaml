  nhtsa_sgo:
    name: NHTSA Standing General Order 2021-01 crash reporting data
    url: https://www.nhtsa.gov/laws-regulations/standing-general-order-crash-reporting
    data_url: https://static.nhtsa.gov/odi/ffdd/sgo-2021-01/
