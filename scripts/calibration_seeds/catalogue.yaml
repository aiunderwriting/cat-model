    terms: >-
      Public SEC releases. SEC fair-access policy: at most 10 requests per second and a User-Agent that
      identifies the requester with contact information (read from SEC_EDGAR_USER_AGENT).
    terms_url: https://www.sec.gov/os/accessing-edgar-data
