      Public domain U.S. Government data. NVD asks API users to display "This product uses data from the NVD
      API but is not endorsed or certified by the NVD." and to respect rate limits (5 requests per rolling
      30 seconds without an API key).
    terms_url: https://nvd.nist.gov/developers/terms-of-use
    automated_access: Permitted within the published rate limits; the script sleeps 6.5 s between requests.
  cisa_csaf:
    name: CISA CSAF advisories repository (cisagov/CSAF)
    url: https://github.com/cisagov/CSAF
    data_url: https://github.com/cisagov/CSAF.git
    script: cisa_csaf.py
    terms: >-
      CISA advisories are U.S. Government works; the repository has no LICENSE file and states its purpose as
