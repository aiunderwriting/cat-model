seeds:
# ================= V-KEV: CISA KEV additions =================
- seed_id: kev-additions-2026q3
  role: primary
  block_id: V-KEV
  source: cisa_kev
  unit: count
  can_resolve_to_zero: false
  quantity: >-
    Number of distinct CVE IDs in CISA's Known Exploited Vulnerabilities (KEV) catalog with a dateAdded from
    2026-07-01 through 2026-09-30, as the catalog's JSON feed records them on 2026-11-02.
  evidence: &kev_evidence >-
    CISA's KEV catalog lists vulnerabilities for which CISA has reliable evidence of exploitation in the wild;
    each entry records the date CISA added it (dateAdded). CISA often adds several entries on one day. An addition
    is not an attack or a loss, and the addition date need not be the first-exploitation date. The table counts
    entries by dateAdded in the catalog as it stood before the information date.
- seed_id: kev-microsoft-additions-2026q3
  role: primary
  block_id: V-KEV
  source: cisa_kev
  unit: count
  can_resolve_to_zero: false
  quantity: >-
    Number of distinct CVE IDs in CISA's KEV catalog whose vendorProject is "Microsoft" with a dateAdded from
    2026-07-01 through 2026-09-30, as the catalog's JSON feed records them on 2026-11-02.
  evidence: >-
    CISA's KEV catalog lists vulnerabilities with reliable evidence of exploitation in the wild and records the
    vendor of the affected product (vendorProject). Microsoft entries are often added on or soon after Microsoft's
    monthly security updates (the second Tuesday of each month) when exploitation is reported, sometimes for older
    products and older CVEs. The table counts entries by dateAdded in the catalog as it stood before the
    information date.
- seed_id: kev-additions-2026-10
  role: primary
  block_id: V-KEV
  source: cisa_kev
  unit: count
  can_resolve_to_zero: false
  quantity: >-
    Number of distinct CVE IDs in CISA's KEV catalog with a dateAdded from 2026-10-01 through 2026-10-31, as the
    catalog's JSON feed records them on 2026-11-02.
  evidence: *kev_evidence
# ================= V-CVE: NVD publication volume and AI-related CVEs =================
- seed_id: nvd-cves-published-2026q3
  role: primary
  block_id: V-CVE
  source: nvd
  unit: count
  can_resolve_to_zero: false
  quantity: >-
    Number of CVE records in the NIST National Vulnerability Database with a published date from
    2026-07-01T00:00:00.000Z through 2026-09-30T23:59:59.999Z, excluding records with REJECTED status, as
    reported by the NVD CVE API 2.0 (totalResults with the noRejected filter) on 2026-11-02.
  evidence: &nvd_evidence >-
    NVD republishes every CVE record that a CVE Numbering Authority (CNA) publishes; the published date is when
    the record first appeared. Records later rejected (for example duplicates or withdrawn reports) are excluded.
    Volume reflects disclosure and CNA publication activity, including occasional bulk publications by single
    CNAs, not exploitation.
- seed_id: nvd-cves-published-2026-10
  role: primary
  block_id: V-CVE
  source: nvd
  unit: count
  can_resolve_to_zero: false
  quantity: >-
    Number of CVE records in the NIST National Vulnerability Database with a published date from
    2026-10-01T00:00:00.000Z through 2026-10-31T23:59:59.999Z, excluding records with REJECTED status, as
    reported by the NVD CVE API 2.0 (totalResults with the noRejected filter) on 2026-11-02.
  evidence: *nvd_evidence
- seed_id: nvd-prompt-injection-cves-2026q3
  role: primary
  block_id: V-CVE
  source: nvd
  unit: count
  can_resolve_to_zero: false
  quantity: >-
    Number of non-rejected CVE records in the NVD with a published date from 2026-07-01T00:00:00.000Z through
    2026-09-30T23:59:59.999Z whose description contains the exact phrase "prompt injection", as returned by the
    NVD CVE API 2.0 keyword search (keywordSearch with keywordExactMatch and noRejected) on 2026-11-02.
  evidence: >-
    These CVE records describe vulnerabilities in which crafted text supplied to an application built on a
    language model makes it deviate from its intended instructions, for example to exfiltrate data through agent
    tools. The count measures disclosed, CVE-assigned vulnerabilities in software that integrates language models,
    not attacks or incidents. The CNA writes the description, so a phrase search misses records that use other
    wording.
# ================= V-ICS: CISA ICS advisories =================
- seed_id: cisa-ics-advisories-2026q3
  role: primary
  block_id: V-ICS
  source: cisa_csaf
  unit: count
  can_resolve_to_zero: false
  quantity: >-
    Number of distinct CISA industrial control system advisories (base IDs ICSA-YY-DDD-NN, excluding "ICSMA-"
    medical advisories) in the cisagov/CSAF repository whose CISA release date encoded in the ID (year YY, day of
    year DDD) falls from 2026-07-01 through 2026-09-30, as of the repository state on 2026-11-02.
  evidence: >-
    CISA publishes advisories on vulnerabilities in industrial control system and operational-technology
    products, often several per day, with IDs of the form ICSA-YY-DDD-NN, where DDD is the day of year of CISA's
    release. Each advisory is mirrored in machine-readable CSAF format in the cisagov/CSAF repository; updates keep
    the ID. Some advisories republish a vendor's own advisory, sometimes weeks after the vendor's release; the
    count uses CISA's release date from the ID. The table is computed from the repository as it stood before the
    information date.
- seed_id: cisa-ics-medical-advisories-2026q3
  role: primary
  block_id: V-ICS
  source: cisa_csaf
  unit: count
  can_resolve_to_zero: true
  quantity: >-
    Number of distinct CISA ICS medical advisories (base IDs ICSMA-YY-DDD-NN) in the cisagov/CSAF repository whose
    CISA release date encoded in the ID (year YY, day of year DDD) falls from 2026-07-01 through 2026-09-30, as of
    the repository state on 2026-11-02.
  evidence: >-
    CISA issues ICS medical advisories (ICSMA) for vulnerabilities in medical devices and healthcare operational
    technology, mirrored in CSAF format in the cisagov/CSAF repository. They are far less frequent than general ICS
    advisories. The table is computed from the repository as it stood before the information date.
# ================= V-GHSA: open-source advisory databases (shared records) =================
- seed_id: ghsa-reviewed-2026q3
  role: primary
  block_id: V-GHSA
  source: ghsa
  unit: count
  can_resolve_to_zero: false
  quantity: >-
    Number of GitHub-reviewed advisories in the GitHub Advisory Database (github/advisory-database repository)
    whose github_reviewed_at timestamp falls from 2026-07-01 through 2026-09-30 (UTC), excluding withdrawn
    advisories, as of the repository state on 2026-11-02.
  evidence: >-
    The GitHub Advisory Database records vulnerabilities in open-source packages (npm, PyPI, Maven, Go, crates.io
    and others). GitHub's curation team reviews advisories that come from maintainers' repository security
    advisories, CVE feeds and community contributions, and records when each was marked GitHub-reviewed. Malware
    advisories are not in this repository. Volume depends on maintainer and researcher disclosure and on curation
    capacity. The table is computed from the repository as it stood before the information date.
- seed_id: go-vulndb-reports-2026q3
  role: primary
  block_id: V-GHSA
  source: osv
  unit: count
  can_resolve_to_zero: false
  quantity: >-
    Number of Go vulnerability database reports (IDs beginning "GO-") in OSV.dev's Go ecosystem export, as
    retrieved on 2026-11-02, whose published timestamp falls from 2026-07-01 through 2026-09-30 (UTC), excluding
    withdrawn reports.
  evidence: >-
    The Go vulnerability database, maintained by the Go security team, publishes reports on vulnerabilities in Go
    modules, many triaged from GitHub advisories and CVEs that affect Go code, and exports them to OSV.dev with a
    published timestamp. Reports are sometimes published in batches when a backlog is processed.
- seed_id: rustsec-advisories-2026q3
  role: primary
  block_id: V-GHSA
  source: osv
  unit: count
  can_resolve_to_zero: false
  quantity: >-
    Number of RustSec advisories (IDs beginning "RUSTSEC-") in OSV.dev's crates.io ecosystem export, as retrieved
    on 2026-11-02, whose published timestamp falls from 2026-07-01 through 2026-09-30 (UTC), excluding withdrawn
    advisories.
  evidence: >-
    The RustSec Advisory Database, maintained by the Rust Secure Code working group, records vulnerabilities,
    memory-safety unsoundness and unmaintained-crate notices for Rust crates, and exports them to OSV.dev with a
    published timestamp taken from the advisory's date, which can precede the advisory's addition to the database.
    Many RustSec advisories are mirrored in the GitHub Advisory Database. Months after May 2026 are omitted from the
    table because advisories dated then may not have been added by the information date.
# ================= S-MAL: malicious packages (OpenSSF via OSV) =================
- seed_id: osv-mal-npm-2026q3
  role: primary
  block_id: S-MAL
  source: osv
  unit: count
  can_resolve_to_zero: false
  quantity: >-
    Number of malicious-package records (IDs beginning "MAL-") in OSV.dev's npm ecosystem export, as retrieved on
    2026-11-02, whose published timestamp falls from 2026-07-01 through 2026-09-30 (UTC), excluding withdrawn
    records.
  evidence: &mal_evidence >-
    OpenSSF's malicious-packages project publishes OSV records (MAL- IDs) for open-source packages found to contain
    malware, such as credential stealers and typosquats, fed by automated scanners and security vendors; the
    records appear in OSV.dev's per-ecosystem exports. A single campaign can produce hundreds or thousands of
    records in a day, so counts are lumpy and track detection and reporting pipelines as well as attacker activity.
- seed_id: osv-mal-pypi-2026q3
  role: primary
  block_id: S-MAL
  source: osv
  unit: count
  can_resolve_to_zero: false
  quantity: >-
    Number of malicious-package records (IDs beginning "MAL-") in OSV.dev's PyPI ecosystem export, as retrieved on
    2026-11-02, whose published timestamp falls from 2026-07-01 through 2026-09-30 (UTC), excluding withdrawn
    records.
  evidence: *mal_evidence
- seed_id: osv-mal-crates-2026q3
  role: primary
  block_id: S-MAL
  source: osv
  unit: count
  can_resolve_to_zero: true
  quantity: >-
    Number of malicious-package records (IDs beginning "MAL-") in OSV.dev's crates.io (Rust) ecosystem export, as
    retrieved on 2026-11-02, whose published timestamp falls from 2026-07-01 through 2026-09-30 (UTC), excluding
    withdrawn records.
  evidence: >-
    OpenSSF's malicious-packages project publishes OSV records (MAL- IDs) for packages found to contain malware.
    Malicious Rust crates on crates.io have been reported far less often than malicious npm or PyPI packages;
    several quarters have none.
# ================= X-EDB: public exploit code =================
- seed_id: exploitdb-additions-2026q3
  role: primary
  block_id: X-EDB
  source: exploitdb
  unit: count
  can_resolve_to_zero: false
  quantity: >-
    Number of distinct entry IDs in the Exploit Database index files_exploits.csv (GitLab
    exploit-database/exploitdb, main branch, as retrieved on 2026-11-02) whose date_added falls from 2026-07-01
    through 2026-09-30.
  evidence: >-
    Exploit Database, maintained by OffSec, archives public exploit code and proof-of-concept submissions and
    records when each entry was added (date_added). Additions are made in irregular batches as submissions are
    processed, so quarterly counts swing widely.
# ================= B-NOTICE: breach notifications (shared incidents across HHS and state lists) =================
- seed_id: hhs-ocr-breaches-2026q3
  role: primary
  block_id: B-NOTICE
  source: hhs_ocr
  unit: count
  can_resolve_to_zero: false
  quantity: >-
    Number of breaches of unsecured protected health information affecting 500 or more individuals listed on the
    HHS Office for Civil Rights breach portal (under-investigation and archive lists combined) with a Breach
    Submission Date from 2026-07-01 through 2026-09-30, as the portal lists them on 2026-11-02.
  evidence: >-
    HIPAA covered entities must report breaches of unsecured protected health information affecting 500 or more
    individuals to HHS within 60 days of discovery; business associates notify the covered entity, which reports.
    The HHS Office for Civil Rights lists the reports on a public portal and moves closed investigations to an
    archive list. The submission date is when the report reached OCR, often weeks or months after the breach. One
    vendor incident can generate many separate reports from affected covered entities. Months after May 2026 are
    omitted from the table because reports submitted then may not have been posted by the information date.
- seed_id: ca-ag-breach-notices-2026q3
  role: primary
  block_id: B-NOTICE
  source: ca_ag
  unit: count
  can_resolve_to_zero: false
