    terms_url: https://gitlab.com/exploit-database/exploitdb
    automated_access: Permitted; the CSV is offered for download from the public repository.
  defihacklabs:
    name: DeFiHackLabs incident list (SunWeb3Sec/DeFiHackLabs)
