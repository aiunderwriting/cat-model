    url: https://www.nhtsa.gov/nhtsa-datasets-and-apis
    data_url: https://static.nhtsa.gov/odi/ffdd/
    script: nhtsa_defects.py
    terms: Public domain U.S. Government data offered as downloadable flat files.
    terms_url: https://www.nhtsa.gov/about-nhtsa/website-policies
