  text: |-
    Scale reference from a natural pandemic, not an attack or an AI-assisted event. Cutler and Summers
    (JAMA, October 2020) estimated the cost of COVID-19 to the United States at more than USD 16
    trillion, roughly 90% of annual GDP: about half in lost output and the rest in premature death and
    long-term and mental health impairment, valuing a statistical life at USD 7 million. An IMF blog
    of 25 January 2022 expected global economic losses close to USD 13.8 trillion through 2024
    relative to pre-pandemic forecasts. WHO researchers estimated 14.83 million excess deaths
    worldwide in 2020 and 2021 (uncertainty interval 13.23 million to 16.58 million), 2.74 times the
    5.42 million COVID-19 deaths reported to WHO.
