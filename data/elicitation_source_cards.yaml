- card_id: eu-ai-act-article-5-penalties
  observation_through_utc: 2026-09-07
  availability_date_utc: 2026-09-07
  availability_basis: Availability bound for this excerpt, whose sources were checked on 2026-09-07; the EU
    Publications Office's copy of the consolidated text was read on 2026-11-19.
  text: |-
    Article 99(3) of the EU AI Act, in its version consolidated on 27 July 2026, sets the maximum
    fine for the prohibited practices of Article 5 at EUR 35 million or, for an undertaking, 7% of
    total worldwide turnover in the preceding financial year, whichever is higher. Article 99(6)
    applies the lower amount to SMEs, including start-ups, and Article 99(7) requires a
    case-specific assessment that includes fines already imposed on the same operator for the same
    infringement or activity. Article 113 applies Chapter II from 2 February 2025, except the
    later-added Article 5(1)(ba) and (bb) and Article 5(1a) and (1b), which apply from 2 December
    2026, so the prohibitions have two application dates. The penalties chapter (Chapter XII)
    applies from 2 August 2025, except Article 101, and 2 August 2026 is the Act's general
    application date. Authorities can take up a matter through national market surveillance under
    Article 74 or AI Office supervision of Article 75(1) systems. Under Article 75a the AI Office
    may open an investigation where it has reasonable grounds to suspect non-compliance, and may
    request information even before it opens one, so neither step needs a final infringement
    finding.
  sources:
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
  - https://publications.europa.eu/resource/celex/02024R1689-20260727
