  text: |-
    AI-specific reference from one developer's own reporting. OpenAI's October 2025 threat report
    says that since it began public threat reporting in February 2024 it had disrupted and reported
    over 40 networks that violated its usage policies, not broken down by type; it names malicious
    cyber activity, organized crime and scams, covert influence operations and authoritarian
    regimes' use as abuse types. It estimates that ChatGPT is used to identify scams up to three
    times more often than for scams. A September 2025 paper by OpenAI, Duke and Harvard authors
    reports that by July 2025 ChatGPT's consumer plans had 700 million weekly users sending 18
    billion messages weekly. These are networks OpenAI detected, disrupted and chose to report, not
    all misuse of its or other developers' models, and carry no loss amounts.
