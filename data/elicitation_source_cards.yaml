  availability_basis: Availability bound for this excerpt, whose sources were checked on 2026-09-07; the EU
    Publications Office's copy of the regulation was read on 2026-11-19.
  text: |-
    The EU AI Act's original prohibited-practice rules applied from 2 February 2025, and
    obligations for providers of general-purpose AI models from 2 August 2025, subject to
    transition provisions. Article 101, which applies from 2 August 2026, caps fines on those
    providers at EUR 15 million or 3% of annual total worldwide turnover in the preceding financial
    year, whichever is higher. Annualized revenue is not that turnover measure, and a ceiling is
    not a forecast fine or a finding of liability for a downstream customer's conduct.
  sources:
  - https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng
