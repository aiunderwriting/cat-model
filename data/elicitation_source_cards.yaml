  text: |-
    The SEC and CFTC staff report on the market events of 6 May 2010 describes a mutual fund
    complex's program to sell 75,000 E-mini contracts, valued at about $4.1B, amid thinning
    liquidity. That figure is trading notional, not realized loss, and the temporary repricing of
    markets is a different quantity again.
  sources:
  - https://www.sec.gov/news/studies/2010/marketevents-report.pdf
- card_id: nhtsa-crash-reporting
  observation_through_utc: 2026-09-07
  availability_date_utc: 2026-09-07
  availability_basis: Availability bound for this excerpt, whose sources were checked on 2026-09-07.
  text: |-
    NHTSA crash reports under its Standing General Order are subject to reporting thresholds and
    updates, and one crash can have several reports. They are not normalized by exposure, and
    automated driving systems and Level 2 driver assistance are different categories.
  sources:
  - https://www.nhtsa.gov/laws-regulations/standing-general-order-crash-reporting
