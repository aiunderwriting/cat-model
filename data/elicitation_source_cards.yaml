- card_id: krafton-chatbot-strategy-ruling-2026
  observation_through_utc: 2026-03-16
  availability_date_utc: 2026-03-16
  availability_basis: The opinion states that it was decided on 2026-03-16.
  text: |-
    In Fortis Advisors v. Krafton (Delaware Court of Chancery, 16 March 2026), the court found that
    Krafton, which bought the game studio Unknown Worlds in 2021 for USD 500 million plus up to USD
    250 million in contingent earnout payments, breached the agreement by firing the studio's leaders
    and taking over its operations. It found that Krafton's chief executive, warned internally that
    dismissal would not remove the earnout obligation, turned to ChatGPT, which prepared a response
    strategy, and that Krafton followed most of its recommendations. The court reinstated the studio's
    chief executive and extended the earnout period, reserving money damages for a second phase. The
    opinion resolves a contract dispute and does not name the chatbot's developer.
  sources:
