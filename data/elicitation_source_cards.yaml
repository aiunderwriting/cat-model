  availability_date_utc: 2026-10-21
  availability_basis: The latest cited Commission release, on Booking.com, is dated 2026-10-21; the others are
    dated from 2023-12-18 to 2026-08-31.
  text: |-
    Regulator-level reference for the largest online services in the EU, not AI-specific. The
    European Commission had designated 28 very large online platforms and search engines under the
    Digital Services Act by 31 August 2026, when it designated ChatGPT as a very large online search
    engine, its added obligations due by January 2027. Releases from 18 December 2023 to 21 October
    2026 announce formal proceedings against twelve providers: X, TikTok, AliExpress, Meta, Temu,
    Pornhub, Stripchat, XNXX, XVideos, Shein, Snapchat and Booking.com. Its first non-compliance
    decision, on 5 December 2025, fined X EUR 120 million, followed by fines of EUR 200 million on
    Temu (28 May 2026) and EUR 550 million on AliExpress (20 July 2026). The cited releases are not
    a complete log and omit information requests and the companies' costs.
  sources:
