- card_id: prompt-injection-prevalence-measurements-2026
  observation_through_utc: 2026-05-27
  availability_date_utc: 2026-05-27
  availability_basis: arXiv gives the first version of the web study as submitted on 2026-04-29 and the resume
    study on 2026-05-27; the submission dates bound the measurements. A second version of the web study,
    revised on 2026-11-04, was not used.
  text: |-
    AI-specific measurements of planted instructions, not of losses. Khodayari and co-authors
    (arXiv, April 2026) analysed 1.2 billion URLs from 24.8 million hosts and identified 15.3
    thousand validated indirect prompt injections across 11.7 thousand web pages; about 70% sat in
    non-rendered HTML, and aims ranged from disruptive prompts and reputation manipulation to
    content-protection directives and AI-bot detection. In their 5,200 controlled experiments across
    13 models, compliance was limited but reached up to 8% for smaller models on plain-text inputs.
    A second study (arXiv, May 2026) of approximately 200 thousand real resumes collected over
    multiple years by hireEZ found that approximately 1% contained hidden prompt injections. Both
    count instructions planted in content that AI systems may read; neither counts deployed systems
    that acted on them, or any loss.
  sources:
  - https://arxiv.org/abs/2604.27202v1
  - https://arxiv.org/abs/2605.28999
