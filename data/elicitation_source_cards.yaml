  text: |-
    All-cause European reference, not AI-related. For its 2023 report ENISA, the EU cybersecurity
    agency, surveyed 1,080 operators of essential services and digital service providers: asked
    whether they experienced a significant information security incident in 2022, 70 (6%) said yes,
    903 (84%) no and 107 (10%) could not share. Thirty-eight of the 70 gave direct costs, with a
