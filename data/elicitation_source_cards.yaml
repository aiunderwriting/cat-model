- card_id: large-copyright-claims
  observation_through_utc: 2025-10-17
  availability_date_utc: 2025-10-17
  availability_basis: The cited court opinion was filed on 2025-10-17; this bounds availability and is not the curation date.
  text: |-
    Reference class: private copyright and other IP claims against AI companies resolved at or
    above USD 1 billion, as of October 2025. This example is a lower bound, not a census. In Bartz
    v. Anthropic, a copyright class action in the Northern District of California over books that
    Anthropic downloaded from pirate libraries and copied, the parties settled at about USD 3,100
    per work across 482,460 works, which comes to about USD 1.5 billion before costs and fees, and
    the court granted preliminary approval in September 2025. The court described the case as
    concerning AI inputs, not AI outputs: class members release past claims over pirating and
    copying their works up to the point of any AI output, but not claims about AI outputs or about
    conduct from 25 August 2025, and Anthropic is to destroy copies of class members' works derived
    from the LibGen and PiLiMi libraries, unless legally required to preserve them. Had the
    plaintiffs won at trial, statutory damages could have ranged from USD 200 to USD 150,000 per
    work. One matter does not establish a frequency, a settlement is not an adjudication of
    liability, and it is the claimants' payment, not the matter's complete cost; defense costs are
    additional.
  sources:
  - https://www.govinfo.gov/content/pkg/USCOURTS-cand-3_24-cv-05417/pdf/USCOURTS-cand-3_24-cv-05417-5.pdf
