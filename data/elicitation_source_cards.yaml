- card_id: anthropic-designation-2026
  observation_through_utc: 2026-09-25
  availability_date_utc: 2026-09-25
  availability_basis: The latest cited source, the D.C. Circuit's opinion, was decided on 2026-09-25; the card describes
    the matter as of that opinion.
  text: |-
    The D.C. Circuit's rulings in Anthropic PBC v. Department of War describe the Secretary of
    War's 3 March 2026 determination under 41 USC 4713 that procuring AI goods or services from
    Anthropic presents a supply-chain risk, after Anthropic refused to authorize use of its Claude
    models for mass domestic surveillance or lethal autonomous warfare. The Department cancelled
    its contracts with Anthropic, began removing Claude from its systems and barred its contractors
    from using Anthropic as a subcontractor on Department work, but did not bar contractors from
    using Claude for work for other customers. On 8 April 2026 the court denied a stay pending
    review and expedited the case; it found that Anthropic would likely suffer some irreparable,
    mainly financial harm and had documented some potentially significant losses, but said the
    precise amount was not fully clear. On 25 September 2026 a divided panel denied Anthropic's
    petitions for review, holding that the Secretary had not exceeded his authority under the
    statute or the Constitution; one judge dissented. The opinion notes that a federal district
    court in California had on 27 August 2026 set aside the Department's separate designation of
    Anthropic as a supply-chain risk under 10 USC 3252, whose definition of that risk is narrower.
    Anthropic's 5 March 2026 statement, a party's account that names 10 USC 3252 as the relevant
    statute, said the designation applies only to use of Claude as a direct part of Department of
    War contracts and that it would challenge the action in court.
  sources:
  - https://media.cadc.uscourts.gov/orders/docs/2026/04/26-1049LDSN3.pdf
  - https://www.anthropic.com/news/where-stand-department-war
