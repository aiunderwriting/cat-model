    million preauthorization requests and 36 million of 424 million payment requests. Beneficiaries
    and providers appealed 1% of denials in 2014 to 2016, and the organizations overturned 75% of
    the denials appealed, about 216,000 a year. In its 2015 audits the Centers for Medicare &
    Medicaid Services cited 79 of 140 audited contracts (56%) for inappropriately denying requests,
    and afterwards fined nine organizations a total of USD 1.9 million. These are insurers' coverage
    and payment decisions, and the report does not say what share was made by software.
