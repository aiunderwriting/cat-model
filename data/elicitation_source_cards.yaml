- card_id: diagnostic-error-rates-us-2000-2021
  observation_through_utc: 2021-09-30
  availability_date_utc: 2024-01-19
  availability_basis: PubMed dates the latest study (Newman-Toker et al.) 2024-01-19; the AHRQ review is dated
    December 2022 and searched literature through September 2021, and the Singh study was published in 2014.
  text: |-
    All-cause clinical reference, not AI-related. Singh et al. (2014), pooling three US studies,
    estimated that outpatient diagnostic errors affect 5.08% of US adults a year, about 12 million,
    and that about half could be harmful. A 2022 review for the US Agency for Healthcare Research
    and Quality estimated that 5.7% of emergency department visits have a diagnostic error, 2.0% a
    preventable adverse event and 0.3% a serious harm (permanent disability or death): across 130
    million visits a year, 7.4 million errors and 371,000 serious harms, its overall rates resting
    on three non-US studies (combined n=1,758). Newman-Toker et al. (2024) estimated 795,000 deaths
    or permanent disabilities a year from misdiagnosis across US care settings (plausible range
    598,000 to 1,023,000). All three are extrapolations, not counts of claims or payments.
  sources:
