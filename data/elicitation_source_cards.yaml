- card_id: paid-malpractice-claim-rates-1992-2014
  observation_through_utc: 2014-12-31
  availability_date_utc: 2017-05-01
  availability_basis: PubMed gives the later study's issue date as 2017-05-01 and its data window as ending
    on 2014-12-31; the earlier study was published on 2011-08-18.
  text: |-
    All-cause professional reference, not AI-related. Schaffer et al. (2017) analyzed the 280,368
    malpractice claims paid on behalf of US physicians in the National Practitioner Data Bank from
    1992 to 2014, over an estimated 19.9 million physician-years. Paid claims fell from 20.1 per 1,000
    physician-years in 1992-1996 to 8.9 in 2009-2014; the mean payment was USD 329,565 in 2014
    dollars, and 7.6% of paid claims exceeded USD 1 million. Jena et al. (2011), using one insurer's
    records for 1991-2005, found that 7.4% of physicians had a claim each year and 1.6% a claim
    leading to a payment. Both count claims against individual physicians, not incidents or injured
    patients.
  sources:
  - https://pubmed.ncbi.nlm.nih.gov/28346582/
  - https://pubmed.ncbi.nlm.nih.gov/21848463/
- card_id: clinician-automation-bias-studies-2023
  observation_through_utc: 2023-01-31
  availability_date_utc: 2023-12-19
  availability_basis: PubMed dates the later study 2023-12-19 and says its survey ran from April 2022
    to January 2023; the earlier study was published online on 2023-05-02.
  text: |-
    Two 2023 experiments measured how clinicians respond to wrong AI suggestions. In Dratsch et al.,
    27 radiologists read 50 mammograms with a purported AI aid; when it suggested an incorrect
    category, the share of correctly rated mammograms fell from 79.7% to 19.8% for inexperienced
    readers and from 82.3% to 45.5% for very experienced readers. In Jabbour et al., 457 US hospital
    clinicians diagnosed patient vignettes; baseline accuracy was 73.0%, a standard AI model raised it
    by 2.9 percentage points, and a systematically biased model lowered it by 11.3 points, which
    image-based explanations of the model did not significantly offset. Both used test cases outside
    patient care and measured accuracy, not harm.
  sources:
  - https://pubmed.ncbi.nlm.nih.gov/37129490/
  - https://pubmed.ncbi.nlm.nih.gov/38112814/
- card_id: zillow-offers-writedown-2021
  observation_through_utc: 2021-11-02
  availability_date_utc: 2021-11-02
  availability_basis: The Form 8-K gives 2021-11-02 as its date of report and the attached press release
    is datelined Nov. 2, 2021.
  text: |-
    Reference case of losses after relying on a company's own price forecasts, not on output of a
    general-purpose AI model. On 2 November 2021 Zillow Group reported a write-down of about USD 304
    million on homes its Zillow Offers business had bought in the third quarter at prices above its
    current estimates of future selling prices, expected a further USD 240 million to USD 265 million
    of losses in the fourth quarter, and decided to wind the business down. Its chief executive said
    the unpredictability in forecasting home prices far exceeded what it had anticipated. The AI
    Incident Database lists the matter as a failure of Zillow's AI-powered predictive pricing tool;
    the filing does not say what part automated pricing played in individual purchases.
