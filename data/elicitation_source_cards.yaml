  text: |-
    The Agent Incident Registry (Kumar et al., September 2026) catalogs 487 source-linked records of
    AI-agent events disclosed from 2022 to 5 September 2026, one record per event whatever the number
    of victims. Of these, 92 are safety failures with no adversary-supplied trigger, 87 of them with
    realized harm to a real party; documented mechanisms include destructive shell actions and
    uncommanded publication. In 36 records a human acted on AI output, 31 with realized harm. The
