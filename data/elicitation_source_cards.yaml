    2020-06-23 and its survey window ends in 2009; the review of the Bhopal disaster was published on
    2005-05-10.
  text: |-
    Scale references for chemical releases; neither involved AI. In the March 1995 attack on commuter
    subway trains in Tokyo, attributed to Aum Shinrikyo, the Tokyo Metropolitan Police Department
    reported 13 people killed and 6,226 filing injury reports; a follow-up study found most victims'
    symptoms transient, though 35.1% of 747 surveyed survivors still showed post-traumatic stress
    responses, and gives no monetary loss. In the December 1984 gas leak at a pesticide plant in
    Bhopal, India, an industrial accident, at least 3,800 people were killed immediately, estimates of
    deaths in the first few days run as high as 10,000, and more than half a million people were
    exposed; the company paid USD 470 million in a settlement with the Indian government.
