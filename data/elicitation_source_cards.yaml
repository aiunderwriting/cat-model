    dated December 2011, 2024-04-24 and 2025-01-28.
  text: |-
    Telephone triage by health care providers, not AI-related, then three chatbot studies rating
    potential, not actual, harm. A systematic review (Huibers et al., 2011) found out-of-hours
    triage safe in 97% of patient contacts and 89% of high-urgency contacts across 13 observational
    studies, but 46% in 10 studies of high-risk simulated patients. In Chen et al. (2024),
    physicians judged that unedited GPT-4 drafts answering simulated cancer patients risked severe
    harm in 11 of 156 assessments and death in one. Experts rating a preselected 20 inaccurate Bing
    copilot drug answers judged 66% potentially harmful and 22% able to cause severe harm or death
    (Andrikyan et al., 2025). A physician red-team preprint (Draelos et al., 2025) found 5% (Claude)
    to 13% (GPT-4o, Llama) of answers to 222 patient questions unsafe.
