  observation_through_utc: 2026-09-07
  availability_date_utc: 2026-09-07
  availability_basis: Availability bound for this excerpt, whose sources were checked on 2026-09-07.
  text: |-
    Gartner's May-June 2025 survey of 360 IT application leaders found 15% considering, piloting or
    deploying fully autonomous AI agents. This is not production-only adoption and does not count
    deployments.
  sources:
  - https://www.gartner.com/en/newsroom/press-releases/2025-09-30-gartner-survey-finds-just-15-percent-of-it-application-leaders-are-considering-piloting-or-deploying-fully-autonomous-ai-agents
- card_id: automated-eligibility-cases
  observation_through_utc: 2026-09-07
  availability_date_utc: 2026-09-07
  availability_basis: Availability bound for this excerpt, whose sources were checked on 2026-09-07.
  text: |-
    In September 2023 the EEOC announced that iTutorGroup would pay $365,000 and provide other
    relief to settle the agency's suit alleging that its application software automatically
    rejected female applicants aged 55 or older and male applicants aged 60 or older, in violation
    of the Age Discrimination in Employment Act. The New York Department of Financial Services'
    March 2021 report on its investigation of the Apple Card, underwritten by Goldman Sachs Bank
    USA, did not find evidence of deliberate or disparate-impact discrimination, but found
    deficiencies in customer service and transparency. Neither matter concerned a frontier AI
    model.
  sources:
  - https://www.eeoc.gov/newsroom/itutorgroup-pay-365000-settle-eeoc-discriminatory-hiring-suit
  - https://www.dfs.ny.gov/system/files/documents/2021/03/rpt_202103_apple_card_investigation.pdf
- card_id: platform-penalty-ceilings
  observation_through_utc: 2026-09-07
  availability_date_utc: 2026-09-07
  availability_basis: Availability bound for this excerpt, whose sources were checked on 2026-09-07; the
    Commission's list of designated services was read on 2026-11-19 for the designations of 25 April 2023 and 31
    August 2026.
  text: |-
    The EU Digital Services Act applied generally from 17 February 2024; designated very large
    online platforms and search engines became subject to their obligations four months after
    notification, including the first designations on 25 April 2023. Its Articles 52 and 74 cap
    fines at 6% of the provider's worldwide annual turnover in the preceding financial year.
    Schedule 13 of the UK Online Safety Act sets a maximum penalty of the greater of GBP 18 million
    and 10% of qualifying worldwide revenue, with statutory entity and accounting-period rules.
    These are legal maxima for breaches of those regimes, not typical fines or liability of a model
    supplier for a platform's conduct. An AI assistant can itself be a designated service: the
    Commission's list of designated services shows ChatGPT, provided in the EU by OpenAI Ireland
    Limited, designated a very large online search engine on 31 August 2026.
  sources:
  - https://digital-strategy.ec.europa.eu/en/policies/dsa-enforcement
  - https://digital-strategy.ec.europa.eu/en/policies/list-designated-vlops-and-vloses
  - https://eur-lex.europa.eu/eli/reg/2022/2065/oj/eng
  - https://publications.europa.eu/resource/celex/32022R2065
  - https://www.legislation.gov.uk/ukpga/2023/50/schedule/13
