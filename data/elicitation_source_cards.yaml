- card_id: cnil-complaints-and-sanctions-2024-2025
  observation_through_utc: 2025-12-31
  availability_date_utc: 2026-05-19
  availability_basis: The CNIL's annual-report page is dated 19 May 2026 and its 2025 sanctions review 09
    February 2026; both report calendar 2025, and the 2024 review is dated 05 February 2025.
  text: |-
    Single-regulator reference, not AI-specific. France's data protection authority, the CNIL,
    reports that in 2025 it received 20,150 complaints, carried out 323 investigations and issued
    259 corrective measures, of which 83 were sanctions with fines totalling EUR 486,839,500.
    Sixteen sanctions came from its restricted committee under the ordinary procedure and 67 under
    the simplified procedure; ten were made public. It says two significant sanctions explain the
    unprecedented total, and reports cookie fines of EUR 325 million and EUR 150 million on two
    major players. In 2024 it issued 87 sanctions totalling EUR 55,212,400; the 69 under the
    simplified procedure came to EUR 715,500. These are one national regulator's decisions; they
    give neither the number of organisations it supervises nor those organisations' costs.
  sources:
  - https://www.cnil.fr/en/annual-report-2025
  - https://www.cnil.fr/en/sanctions-and-corrective-measures-cnils-actions-2025
  - https://www.cnil.fr/en/sanctions-and-corrective-measures-cnils-actions-2024
- card_id: us-federal-suspension-debarment-actions-2023-2024
  observation_through_utc: 2024-11-30
  availability_date_utc: 2026-06-16
  availability_basis: GAO dates its report June 16, 2026 and its latest exclusions file November 2024; the
    committee's report letter is dated December 31, 2024 and covers fiscal year 2023, and the GSA sheet's PDF
    was created on 2023-08-04.
  text: |-
    All-contractor reference, not AI-related. The Interagency Suspension and Debarment Committee
    reports that in fiscal year 2023 US federal agencies issued 423 suspensions, 1,165 proposed
    debarments and 1,009 debarments. Actions are counted separately even for one respondent,
    respondents include individuals, and a significant portion of debarred persons had first been
    convicted. As of June 2023 the General Services Administration listed over 674,000 registered
    entities in the government's award system and over 147,000 active exclusion records. GAO counted
    172,091 exclusion records for fiscal years 2023 and 2024, 128,818 without an entity identifier
    (mostly records needing none, e.g. individuals); it found 71,407 entries in that system from the
    health department's exclusion list and 36,115 from Treasury sanctions lists. The committee
    counts discretionary actions only, not statutory debarments or the system's prohibitions and
    restrictions.
  sources:
  - https://www.acquisition.gov/sites/default/files/page_file_uploads/FY23%20Report%20by%20the%20Interagency%20Suspension%20and%20Debarment%20Committee%20on%20Federal%20Agency%20Suspension%20and%20Debarment%20Activities.pdf
  - https://www.gsa.gov/system/files/SAMgov%20by%20the%20Numbers.pdf
  - https://www.gao.gov/assets/gao-26-107466.pdf
