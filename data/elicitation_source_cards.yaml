  text: |-
    All-cause clinical reference, not AI-related. Bates et al. (2023) reviewed a random sample of
    2,809 admissions to 11 Massachusetts hospitals in 2018: 23.6% had at least one adverse event,
    6.8% a preventable one and 1.0% a preventable one of serious or higher severity. The Harvard
    Medical Practice Study reviewed 30,121 records from New York hospitals in 1984: adverse events
    occurred in 3.7% of hospitalizations, and 27.6% of them were due to negligence. Claims were
    filed for 0.13% of discharges; of 280 sampled patients with negligent adverse events 8 filed one
    (weighted rate 1.53%). It estimated 27,179 negligent adverse events statewide against 3,570
    malpractice claims, 7.6 to 1, which it says overstates the chance that such an event produces a
    claim. These are reviews of inpatient records in two states.
