- card_id: large-enforcement-matters
  observation_through_utc: 2026-08-26
  availability_date_utc: 2026-08-26
  availability_basis: The latest cited sources, the multistate settlement agreement and the Texas Attorney General's
    release, were filed and published on 2026-08-26; this bounds availability and is not the curation date.
  text: |-
    All-cause reference class, not AI-related: US federal and state government penalties and
    monetary settlements of at least USD 1 billion over large technology companies' own conduct,
    2017 to August 2026. These examples, from the authorities' own filings and releases, are a
    lower bound, not a census; non-US authorities' matters are outside this list.
    - Facebook (July 2019): a USD 5 billion civil penalty in a stipulated order the Justice
      Department filed for the FTC, which the filing called the largest civil penalty ever
      obtained by the United States on behalf of the FTC.
    - Texas Attorney General: USD 1.4 billion from Meta over biometric data (July 2024); USD 1.375
      billion from Google over location, incognito-search and biometric data (settlement in
      principle, May 2025).
    - Youth-harm claims against Meta (August 2026): an agreement with 47 states, the District of
      Columbia and three territories, filed for entry as consent judgments, provides ten guaranteed
      installments of about USD 1.17 billion each, up to about USD 16.7 billion with contingent
      installments, plus USD 75 million for state costs; the same agreement pays about USD 459
      million to 48 states and territories for releasing separate Cambridge Analytica claims. Texas
      separately announced over USD 1 billion from Meta the same day.
    These are imposed or agreed amounts, often paid over years, and they exclude defense,
    compliance and other costs. Settlements and agreed judgments need not admit liability. The 2019
    filing says the FTC tied the range of civil penalties it sought to about 900 million views of
    Facebook webpages containing allegedly deceptive privacy statements, counting each view as an
    alleged violation; on that method, exposure grows with a platform's reach.
  sources:
