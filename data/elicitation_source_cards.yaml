  text: |-
    Clancy (2023) excerpts median forecasts from the Forecasting Research Institute's 2022 Existential
    Risk Persuasion Tournament of about 170 superforecasters and subject-matter experts. On the
    probability that a genetically engineered pathogen will be the cause of death, within a 5-year
    period, of more than 1% of humans, superforecasters gave 0.25% by 2030, 1.5% by 2050 and 4% by
    2100; domain experts gave 1.22%, 8% and 10.25%. For a pathogen that is not genetically engineered
    the 2100 medians were 3.62% and 8.14%. Only 14 biosecurity domain experts took part. These are
    cumulative probabilities of a global catastrophe from any actor or accident, made before later AI
    models, taken from a secondary excerpt of the tournament report's Table 23.
  sources:
