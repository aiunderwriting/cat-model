  text: |-
    Anthropic's own assessments against its own thresholds. On 22 May 2025 it activated AI Safety
    Level 3 protections with Claude Opus 4 as a precautionary and provisional action: it had not
    determined that the model passed the capability threshold but could no longer clearly rule that
    out. Its model report dated 2 October 2026 treats Claude Opus 5.5, released in September 2026, as
    able to significantly help people with basic technical backgrounds produce known chemical or
    biological weapons, with commensurate safeguards deployed, and concludes that it does not cross
    the threshold for novel weapons capabilities. Elsewhere the report calls it difficult to say with
    full confidence whether any model passes the first threshold and says that, with mitigations,
    Anthropic believes catastrophic risk in this category is low but not negligible.
