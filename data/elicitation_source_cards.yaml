    AI-specific device reference. Lee et al. (JAMA Health Forum, August 2025) matched all 950
    AI-enabled medical devices cleared by the US Food and Drug Administration to the agency's device
    recall database in November 2024: 60 devices (6.3%) were associated with 182 recall events,
    43.4% of them within twelve months of clearance. Diagnostic or measurement errors accounted for
    109 recalls covering 935,063 units, and functionality delay or loss for 44 recalls covering
    755,647 units. Recall-free survival was 96.6% at one year and 91.8% at five years. Each pairing
