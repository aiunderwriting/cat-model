  text: |-
    Reference class: private privacy and biometric claims against technology companies, as of
    September 2025. Examples below USD 1 billion: Facebook's USD 725 million settlement of the
    consumer-privacy class action arising from the Cambridge Analytica scandal, over third-party
    access to user data, whose approval the Ninth Circuit affirmed in February 2025, and Facebook's
    USD 650 million Illinois biometric-privacy settlement, which the district court approved after
    rejecting a USD 550 million version. In a class action over data sharing by the Flo
    period-tracking app, a jury found that Meta, which received the data, violated California's
    Invasion of Privacy Act by obtaining app users' menstrual and ovulation information, and in
    September 2025 the court denied Meta's post-trial motions; the statute provides the greater of
    USD 5,000 per violation or three times actual damages, and the order states no total. Larger
    privacy amounts came from government actions rather than private claims: Texas's USD 1.4
    billion settlement with Meta (2024) and USD 1.375 billion settlement in principle with Google
    (2025). Per-violation statutory damages can make potential exposure exceed past settlements.
    Settlements exclude defense costs, and these examples are selected by size and visibility.
