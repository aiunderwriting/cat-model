# Dated source cards that contextual questions show respondents as evidence. A source bundle
# captures this file as evidence/source_cards.yaml; SourceCardsFile in
# src/catmodel/scenarios/base_rates.py validates it.
#
# A card states what its cited sources report, with their units and dates, and lists every source
# it relies on in `sources`: an https URL, or a precise citation naming its year. It holds no
# authored prior, numerical default, answering instruction or curator note, and it names companies
# and agencies as its sources do. Questions quote each card between delimiter lines, so card text
# has no headings, fences, markup or URLs.
#
# `scenarios` lists, for every scenario in the library, the cards its questions show, in order; an
# empty list shows none. Every card is shown by at least one scenario.
#
# Where a source's original publication date was not recorded, the dates are explicit
# conservative curation bounds, and availability_basis says so.
cards:
- card_id: cbrn-source-4
  observation_through_utc: 2025-12-18
  availability_date_utc: 2025-12-18
  availability_basis: AISI's own catalogue entry dates the report 18 December 2025, read on 2026-11-25; the
    report page prints no date. Publication bounds the observations.
  text: |-
    The UK AI Security Institute's Frontier AI Trends Report (2025) reports models surpassing
    expert baselines on selected biology questions and increased non-expert success with AI
    assistance in controlled studies. Task scores and study odds ratios measure performance in
    those settings, not the likelihood of a weapons program, an attack or casualties, and the
    results depend on the tasks, the participants' expertise and the safeguards in place.
  sources:
  - https://www.aisi.gov.uk/frontier-ai-trends-report
- card_id: cbrn-source-5
  observation_through_utc: 2018-12-31
  availability_date_utc: 2021-06-30
  availability_basis: The journal gives online publication on 2021-06-30 and a study window ending 2018-12-31.
  text: |-
    A published analysis of the Global Terrorism Database (Tin et al., 2021) identified 390 CBRN
    attacks worldwide in 1970-2018: 347 chemical, 31 biological, 12 radiological and none nuclear,
    less than 0.3% of recorded terrorist attacks. It reports 930 deaths and 14,167 non-fatal
    injuries. It excluded ambiguous events, and the database does not cover state terrorism. These
    are historical attack counts, not weapons programs or AI-assisted incidents, and the absence of
    a recorded nuclear attack in the sample does not show that one cannot occur.
  sources:
  - https://www.cambridge.org/core/journals/prehospital-and-disaster-medicine/article/abs/terrorismrelated-chemical-biological-radiation-and-nuclear-attacks-a-historical-global-comparison-influencing-the-emergence-of-counterterrorism-medicine/4449DA9FC6E0143E1E644FBCD7670823
- card_id: cbrn-source-6
  observation_through_utc: 2024-12-31
  availability_date_utc: 2025-12-31
  availability_basis: The brief is dated 2025 and covers 1990-2024; year-end bounds avoid claiming an exact publication day.
  text: |-
    START's Global Chemical, Biological, Radiological and Nuclear Data Suite brief (2025) records
    593 ideologically motivated non-state CBRN events in 1990-2024, including attacks (successful or
    attempted use of CBRN agents) and abandoned or interdicted plots. It reports a general decline
    since the early 2000s; criminal events are in a separate database.
  sources:
  - https://www.start.umd.edu/sites/default/files/publications/local_attachments/CBRN%20brief%20final%20April%202025.pdf
  - https://www.start.umd.edu/publication/global-chemical-biological-radiological-and-nuclear-data-suite
- card_id: cbrn-source-7
  observation_through_utc: 2003-06-04
  availability_date_utc: 2003-06-17
  availability_basis: GAO dates the report 2003-06-04 and its public release 2003-06-17; the report date bounds the observations.
  text: |-
    GAO's report GAO-03-686 on the Capitol Hill anthrax incident found that after the 2001 anthrax
    attacks in the United States, EPA spent about USD 27 million on the Capitol Hill cleanup alone,
    and that some affected buildings elsewhere remained closed in May 2003. This is historical
    expenditure in the dollars of the time on one part of the response, not the attacks' total
    loss.
  sources:
  - https://www.gao.gov/assets/a238422.html
- card_id: cbrn-source-8
  observation_through_utc: 1945-12-31
  availability_date_utc: 2020-07-31
  availability_basis: The ICRC release is dated 2020-07-31; the excerpt uses only its account of the 1945 events.
  text: |-
    The ICRC reports an estimated 70,000 immediate deaths in Hiroshima and 39,000 in Nagasaki in
    August 1945, alongside extensive injury and urban destruction. These were wartime nuclear
    attacks, not non-state or AI-assisted misuse, and the account gives no monetary loss.
  sources:
  - https://www.icrc.org/en/document/75-years-after-hiroshima-and-nagasaki-nuclear-threat-returns
- card_id: cbrn-source-9
  observation_through_utc: 2024-01-25
  availability_date_utc: 2024-01-25
  availability_basis: RAND gives publication on 2024-01-25; publication bounds the completed study, not an asserted experiment date.
  text: |-
    RAND's red-team study, The Operational Risks of AI in Large-Scale Biological Attacks (2024),
    found no statistically significant difference in the assessed viability of biological attack
    plans between teams with access to large language models and the internet and teams with
    internet access alone. It evaluated the models and conditions then available, not attacks,
    and its authors called for more sensitive tests and continued monitoring. A null result for
    the models tested does not bound later models.
  sources:
  - https://www.rand.org/pubs/research_reports/RRA2977-2.html
- card_id: cbrn-source-10
  observation_through_utc: 2025-04-16
  availability_date_utc: 2025-04-16
  availability_basis: The system-card release is dated 2025-04-16; that date bounds the reported pre-release evaluations.
  text: |-
    OpenAI's o3 and o4-mini system card (April 2025) placed both models below the High threshold
    for biological and chemical capability under version 2 of its Preparedness Framework. This is
    a developer's own pre-release assessment against its threshold, not a finding of zero
    contribution or a count of incidents.
  sources:
  - https://openai.com/index/o3-o4-mini-system-card/
- card_id: cbrn-source-11
  observation_through_utc: 2025-04-15
  availability_date_utc: 2025-04-15
  availability_basis: The framework announcement is dated 2025-04-15; this card describes that version's policy, not later revisions.
  text: |-
    OpenAI's April 2025 Preparedness Framework tracks biological and chemical capabilities and
    lists nuclear and radiological risk as a research category. Its High threshold concerns
    capabilities that could amplify existing pathways to severe harm and requires safeguards before
    deployment; its Critical threshold concerns new pathways. These are a developer's governance
    thresholds, not incident rates.
  sources:
  - https://openai.com/index/updating-our-preparedness-framework/
- card_id: aisi-frontier-trends-cyber
  observation_through_utc: 2025-12-18
  availability_date_utc: 2025-12-18
  availability_basis: AISI's own catalogue entry dates the report 18 December 2025, read on 2026-11-25; the
    report page prints no date. Publication bounds the observations.
  text: |-
    The UK AI Security Institute's Frontier AI Trends Report (2025) found the best models averaging
    50% on apprentice-level cyber tasks, compared with less than 9% in late 2023, and describes the
    first model it tested that completed any expert-level cyber tasks, a category benchmarked to
    more than ten years of human experience. These are controlled task results, not attackers' success in
    real intrusions or a loss frequency.
  sources:
  - https://www.aisi.gov.uk/frontier-ai-trends-report
- card_id: bountybench-detect-2025
  observation_through_utc: 2025-07-10
  availability_date_utc: 2025-07-10
  availability_basis: arXiv gives version 2 of the paper, the first to report this result, as submitted on
    2025-07-10, read on 2026-11-25; version 1 is dated 2025-05-21. Publication bounds the observations.
  text: |-
    BountyBench's 12.5% result is the OpenAI Codex CLI agent with o3-high on its Detect task with
    up to three attempts; it is not an overall success rate across bug-bounty tasks, agents or
    models.
  sources:
  - https://arxiv.org/abs/2505.15216
- card_id: cisa-kev-catalog
  observation_through_utc: 2026-09-07
  availability_date_utc: 2026-09-07
  availability_basis: Availability bound for this excerpt, whose sources were checked on 2026-09-07.
  text: |-
    CISA KEV records vulnerabilities with known exploitation. An entry is not an attack, victim, or
    loss occurrence, and its catalog-addition date need not be its discovery or first-exploitation
    date. The due date is a remediation deadline, not observed completion.
  sources:
  - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
- card_id: cyentia-iris-incident-probability-2008-2024
  observation_through_utc: 2024-12-31
  availability_date_utc: 2025-06-23
  availability_basis: Cyentia's press release for the 2025 study is dated 2025-06-13 and the report file
    2025-06-23; the study covers incidents from 2008 through 2024. The 2022 edition's file is dated
    2024-10-22.
  text: |-
    All-cause reference, not AI-attributed. Cyentia's IRIS studies analyse publicly recorded
    security incidents from Zywave's loss database. The 2022 edition modelled a firm's yearly
    probability of one or more incidents by revenue. Counting only organizations with a recorded
    incident, it gave 29.33% above USD 100 billion, 21.93% for USD 10 billion to 100 billion and
    11.53% for USD 10 million to 100 million; counting all organizations registered in the United
    States, 29.30% and 14.20% for the first two. The 2025 edition, using only the first denominator,
    puts a typical organization at 9.3%, against 2.5% in 2008. Losses for 2015 to 2024 had a median
    of USD 603,000 and a 95th percentile of USD 32 million; the 2022 edition's first quartile was
    USD 29,000. Incidents that never become public are not counted.
  sources:
  - https://www.cyentia.com/wp-content/uploads/2026/03/IRIS-2025.pdf
  - https://www.cyentia.com/press-release-information-risk-insights-study-2025/
  - https://www.cyentia.com/wp-content/uploads/2026/03/IRIS-2022_Cyentia.pdf
- card_id: govai-data-damaging-worms-2026
  observation_through_utc: 2025-12-31
  availability_date_utc: 2026-07-31
  availability_basis: GovAI's page for the report gives 2 July 2026 and the report file read was generated on
    2026-07-31, the date used; the report's count of past outbreaks runs to the end of 2025.
  text: |-
    All-cause reference class, not AI-attributed. A 2026 report by Halstead and Righetti for the
    Centre for the Governance of AI studies data-damaging worms: malicious code that spreads on its
    own across large numbers of systems and encrypts, wipes or corrupts data. It counts two such
    outbreaks since 2009 that caused at least USD 1 billion of economic damage, both in 2017: it
    estimates about USD 1 billion for WannaCry, within a plausible range of USD 1 billion to USD 4
    billion, and about USD 10 billion for NotPetya, within a plausible range of USD 3 billion to
    USD 10 billion, and judges that worst-case versions of the two could plausibly have caused
    damage on the order of USD 100 billion. Both used exploits that the report says the NSA
    developed and the Shadow Brokers group leaked publicly in April 2017, within two months of the
    leak. The report identifies as the main technical bottleneck an exploit that spreads without
    user interaction, runs code remotely with administrator privileges or higher and works against
    software on more than 10 million systems. It notes that from 1998 to 2005 individual hackers
    regularly launched worms that infected thousands to tens of millions of systems, while recent
    major attacks were carried out by states. The damage figures are economic costs to firms and
    consumers, not complete losses to all affected parties; the report calls the underlying data
    limited and poor, and it does not attribute either outbreak to AI assistance.
  sources:
  - https://cdn.governance.ai/Report_Assessing_the_Risk_of_AI_Enabled_Computer_Worms.pdf
- card_id: big-sleep-sqlite-2024
  observation_through_utc: 2024-11-01
  availability_date_utc: 2024-11-01
  availability_basis: The post is dated 2024-11-01, read on 2026-11-25. Publication bounds the observations.
  text: |-
    Google announced on 1 November 2024 that its Big Sleep agent had found a stack buffer underflow
    in SQLite in early October, before the code reached an official release, with no impact on
    users. It is one AI-found novel vulnerability, not an exploitation or a loss.
  sources:
  - https://projectzero.google/2024/10/from-naptime-to-big-sleep.html
- card_id: gtig-zero-days-2025
  observation_through_utc: 2025-12-31
  availability_date_utc: 2026-03-05
  availability_basis: Google Threat Intelligence Group published the review on 2026-03-05; it counts zero-days exploited through 2025.
  text: |-
    Google Threat Intelligence Group tracked 90 zero-day vulnerabilities exploited in the wild in
    2025, against 100 in 2023 and 78 in 2024 by the same review's counts, which it says may change
    as past incidents come to light. These are detected exploited vulnerabilities across all
    actors, not campaigns or AI-assisted attacks.
  sources:
  - https://cloud.google.com/blog/topics/threat-intelligence/2025-zero-day-review
- card_id: one-day-exploit-agents-2024
  observation_through_utc: 2024-04-17
  availability_date_utc: 2024-04-17
  availability_basis: arXiv gives the cited version 2 as submitted on 2024-04-17, read on 2026-11-25.
    Publication bounds the observations.
  text: |-
    Fang et al. (2024) report that a GPT-4 agent exploited 87% of 15 one-day vulnerabilities when
    given their CVE descriptions and 7% without them, while the other models tested exploited none.
    This small benchmark is not a success rate of attacks in the field.
  sources:
  - https://arxiv.org/abs/2404.08144v2
- card_id: fbi-help-desk-and-dprk-lures-2024
  observation_through_utc: 2024-09-03
  availability_date_utc: 2024-09-03
  availability_basis: The later cited announcement, I-090324-PSA, is dated 2024-09-03.
  text: |-
    FBI announcement I-041124-PSA (11 April 2024) describes criminals who obtain credentials, pose
    as company employees and contact IT or help-desk staff to update login information, gaining
    access to a company's network to steal data and extort victims. I-090324-PSA (3 September
    2024) describes North Korean actors approaching employees of decentralized-finance and
    cryptocurrency businesses with offers of employment or investment, including requests to run
    code as a pre-employment test, to deploy malware and steal company cryptocurrency. Neither
    announcement counts campaigns or attributes incidents to AI.
  sources:
  - https://www.ic3.gov/PSA/2024/PSA240411
  - https://www.ic3.gov/PSA/2024/PSA240903
- card_id: ic3-critical-infrastructure-2024-2025
  observation_through_utc: 2025-12-31
  availability_date_utc: 2026-04-30
  availability_basis: The IC3 2025 report file carries a date of 2026-04-16; month-end is the bound used for
    its release.
  text: |-
    All-cause US reference, not AI-attributed. IC3's 2025 report records more than 3,600 ransomware
    complaints with reported losses exceeding USD 32 million, a figure it calls artificially low.
    Its chart of complaints from the 16 critical-infrastructure sectors shows, for ransomware and
    data breach respectively, 460 and 182 in healthcare and public health, 355 and 52 in critical
    manufacturing, 258 and 189 in financial services, 232 and 199 in information technology, 80 and
    82 in transportation, 54 and 31 in energy, 51 and 28 in communications and 25 and 11 in water
    and wastewater; more than 1,400 further ransomware complaints came from organizations outside
    those sectors. The 2024 report recorded 4,878 complaints from critical-infrastructure
    organizations affected by a cyber threat. Complaints are self-reported and do not say how
    attackers gained access.
  sources:
  - https://www.ic3.gov/AnnualReport/Reports/2025_IC3Report.pdf
  - https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf
- card_id: software-supply-chain-compromises
  observation_through_utc: 2026-09-07
  availability_date_utc: 2026-09-07
  availability_basis: Availability bound for this excerpt, whose sources were checked on 2026-09-07.
  text: |-
    SolarWinds disclosed in December 2020 that fewer than 18,000 customers may have installed an
    affected version of its Orion software, and its annual report for 2020 states its belief that
    the organizations actually exploited were substantially fewer. Kaseya's July 2021 ransomware
    incident affected fewer than 60 direct customers and no more than 1,500 downstream businesses,
    as of 5 July in the account summarized by the US National Counterintelligence and Security
    Center. CISA's 29 March 2024 alert concerns malicious code in XZ Utils versions 5.6.0 and
    5.6.1, a near miss rather than a realized loss. Potentially affected installations, exploited
    organizations and losses are different quantities, and none of these incidents is attributed to
    AI.
  sources:
  - https://www.sec.gov/Archives/edgar/data/1739942/000162828020017451/swi-20201214.htm
  - https://www.sec.gov/Archives/edgar/data/1739942/000173994221000043/swi-20201231.htm
  - https://archive.dni.gov/files/NCSC/documents/SafeguardingOurFuture/Kaseya%20VSA%20Supply%20Chain%20Ransomware%20Attack.pdf
  - https://www.cisa.gov/news-events/alerts/2024/03/29/reported-supply-chain-compromise-affecting-xz-utils-data-compression-library-cve-2024-3094
  - https://www.cisa.gov/news-events/news/lessons-xz-utils-achieving-more-sustainable-open-source-ecosystem
- card_id: open-source-malware-and-model-hub-scans-2024-2025
  observation_through_utc: 2025-12-31
  availability_date_utc: 2026-10-27
  availability_basis: Sonatype's press release for the report is dated 2026-01-28; the report's web pages were
    served with a last-modified date of 2026-10-27, used here as the bound. arXiv gives the model-hub study as
    submitted on 2024-09-14.
  text: |-
    Software and model registry reference; only the model-hub figures are AI-specific. Sonatype's
    2026 State of the Software Supply Chain report says it identified more than 454,600 new
    malicious packages in 2025, over 99% of them on npm. Its registry table shows 749.7 thousand
    components added to npm in 2025 and 5.59 million in total, without saying whether malicious
    packages are among them. Repository abuse appeared in 55.9% of logged malicious packages and
    secrets exfiltration in 3.9%; self-replicating malware campaigns added 171,740 malicious
    packages to npm in a few months. An academic scan of a Hugging Face mirror for over three months
    monitored more than 705 thousand models and 176 thousand datasets, finding 91 malicious models
    and 9 malicious dataset loading scripts. Packages and models are not campaigns, victims or
    losses.
  sources:
  - https://www.sonatype.com/state-of-the-software-supply-chain/2026/open-source-malware
  - https://www.sonatype.com/state-of-the-software-supply-chain/2026/software-infrastructure-growth
  - https://www.sonatype.com/press-releases/sonatype-research-reveals-open-malware-grows-75-percent
  - https://arxiv.org/abs/2409.09368
- card_id: pytorch-torchtriton-2022
  observation_through_utc: 2022-12-31
  availability_date_utc: 2024-11-14
  availability_basis: The post is dated 2022-12-31 and its page records a modification on 2024-11-14, the
    availability date used; both read on 2026-11-25.
  text: |-
    PyTorch reported that Linux users who installed PyTorch-nightly with pip between 25 and 30
    December 2022 could receive a malicious torchtriton dependency from PyPI that uploaded
    sensitive data from their systems. Stable packages were not affected. The post gives no loss
    amount.
  sources:
  - https://pytorch.org/blog/compromised-nightly-dependency/
- card_id: crowdstrike-outage-2024
  observation_through_utc: 2024-07-24
  availability_date_utc: 2024-07-24
  availability_basis: Parametrix dates its release 2024-07-24, read on 2026-11-25. Publication bounds the
    observations.
  text: |-
    Parametrix estimated that the 19 July 2024 CrowdStrike outage, a defective software update
    that affected many customers at once, cost US Fortune 500 companies other than Microsoft $5.4B
    in direct financial loss, of which $0.54-$1.08B was insured, a range that already reflects
    those customers' policy retentions and limits. The outage was not a malicious attack or an AI
    failure, and the estimates cover neither global losses nor the vendor's liability.
  sources:
  - https://www.parametrixinsurance.com/in-the-news/crowdstrike-to-cost-fortune-500-5-4-billion-insured-loss-range-of-540-million-to-1-08-billion
- card_id: knight-capital-2012
  observation_through_utc: 2026-09-07
  availability_date_utc: 2026-09-07
  availability_basis: Availability bound for this excerpt, whose sources were checked on 2026-09-07.
  text: |-
    The SEC found that on 1 August 2012 Knight Capital's order router sent more than 4 million
    orders into the market in the first 45 minutes after the open while trying to fill 212 customer
    orders, and that the firm eventually lost more than $460 million; Knight, without admitting or
    denying the findings, agreed to pay a $12 million penalty. This was a failure of conventional
    trading software, not of an AI system.
  sources:
  - https://www.sec.gov/newsroom/press-releases/2013-222
- card_id: flash-crash-2010
  observation_through_utc: 2010-09-30
  availability_date_utc: 2010-09-30
  availability_basis: The joint CFTC and SEC staff report is dated 30 September 2010, read in the CFTC's copy
