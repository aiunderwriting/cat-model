  text: |-
    European financial-sector reference, mostly not attacks and not AI-related. The European
    Supervisory Authorities report that financial entities filed 3,383 major ICT-related incidents
    under the Digital Operational Resilience Act in 2025, an average of 0.18 per entity and 0.57 in
    the credit sector; one event can be reported by many entities. Cybersecurity-related incidents
    were 10% of the total; among attacks, 33% were distributed denial of service and 31% data
    exfiltration and manipulation. Almost 40% of incidents reported no costs and around 10% costs
    under EUR 1,000; about 15% of notified incidents, lacking a final report, were left out. In the
    European Banking Authority's questionnaire, completed by 85 banks in February and March 2026,
    78% reported no cyberattack that resulted in an actual major ICT-related incident, against 71%
    in the previous round.
