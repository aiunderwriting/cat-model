- card_id: radiological-nuclear-consequence-estimates
  observation_through_utc: 2019-04-04
  availability_date_utc: 2019-04-04
  availability_basis: The later cited source, GAO-19-468, is marked as published and publicly released
    on 2019-04-04; the RAND report is marked as published on 2006-07-14.
  text: |-
    Modeled scenarios, not events. GAO's April 2019 report GAO-19-468 cites Sandia National
    Laboratories studies of 2017 and 2018 estimating that a large radiological dispersal device in New
    York City would reduce US gross domestic product by about USD 30 billion and cause about 195,000
    evacuations and 1,500 fatalities from the evacuation, and a considerably smaller device about USD
    24 billion and 800 fatalities, with no prompt fatalities from radiation; one expert told GAO the
    estimates may be understated. A 2006 RAND scenario analysis of a terrorist nuclear detonation at
    the Port of Long Beach, California, put possible deaths at 60,000, with six million people trying
    to evacuate and early costs that could exceed USD 1 trillion. RAND calls its cost figures notional
    and valued each life at about USD 350,000 of insurance benefits.
  sources:
