- card_id: chatbot-reality-distortion-prevalence-2025
  observation_through_utc: 2025-12-19
  availability_date_utc: 2026-01-27
  availability_basis: arXiv gives the paper's only version (Sharma et al.) as submitted on 2026-01-27; its
    sample of conversations ran from 12 to 19 December 2025.
  text: |-
    AI-specific prevalence of patterns flagged by model classifiers in conversations, not of
    injuries. Sharma et al. (January 2026), with Anthropic co-authors, had Claude models classify
    1.5 million randomly sampled Claude.ai conversations of 12-19 December 2025: severe
    reality-distortion potential in 0.076%, markers of severe user vulnerability in about one in
    300, actualized reality distortion (transcript evidence that false or misleading model output
    altered a user's beliefs) in 0.048% and actualized action distortion in 0.018%. They call the
    actualized rates a likely lower bound, since such effects can occur without showing in the
    conversation. These are shares of one week's conversations at one developer, estimated from its
    own data; they count neither people, injuries nor claims.
  sources:
