id: "output_reliance_other"
name: "Reliance on Erroneous Output in Other Fields"
node_ids: ["n_reliance_other"]
lineage:
  introduced_in: "r1"
description: >-
  Professionals or members of the public rely on erroneous output from the provider's model in a
  field other than health, legal, financial or software work, such as engineering, research,
  regulatory submissions or everyday decisions, including formal packages with fabricated
  references.
severity_governance:
  policy: "governed_tail_shape"
  tail_class: "cyber_operational"
  tail_class_rationale: >-
    One defect relied on by many users is one incident, so the largest incidents spread loss across
    many decision makers as a defect in relied-on software does. One decision or deliverable's loss
    is bounded by its stakes and the decision maker's balance sheet, but that bound does not hold
    for a merged defect. The lower tail-shape alternative, 0.5, covers the reading that
    single-decision incidents dominate even the far tail.
  cap_posture: "uncapped"
  evidence_refs: ["assumptions.md#severity-and-tails"]
frequency_semantics:
  counting_identity: >-
    One incident is one root cause: one erroneous output or action history, or one identified defect
    in a shared model, configuration, prompt or tool interface, from its first loss to its
    correction, across every affected deployment, organization and party. Use of the same model
    alone does not establish a shared defect; independent errors without one identified defect are
    separate incidents, including several in one deployment in one year. A design or behavior is an
    identified defect only when a specific, correctable model, version, feature or configuration
    property is shown or acknowledged to cause the harms; a pleaded theory alone does not merge
    losses into one incident.
  terminal_event_unit: >-
    One admitted other-field reliance incident: one root cause in which professionals or members of
    the public act on erroneous output from the selected provider's model in a field other than
    health, law, finance or software, the largest share of whose gross loss arises from that
    reliance, and {{admission}}. The whole incident and all its consequences belong here. In this
    scenario a person considers the output and acts on it, however carelessly; a pipeline's or an
    agent's output that takes effect without a person considering that individual output, including
    under automatic or bulk approval, is a bounded-decision or agent incident. Loss to a person or
    business from a false statement about them in output they did not receive is another AI failure
    that no scenario estimates, not this scenario's incident. Harm to a person's mental health from
    engaging with the model, whatever the topic, is an engagement-harm incident. An incident below
    the admission threshold is the unestimated leftover, not this scenario's incident.
  year_rule: >-
    An incident is assigned to the year its first loss occurs; later losses, claims, fines and
    recoveries stay with it and never create another unit.
severity_occurrence_scope: >-
  The complete gross loss of one admitted incident across all affected parties and loss kinds,
  before any recovery: the harm to those who relied on the output and to the people their decisions
  affected, correction and rework, injury where caused, losses the same root cause causes through
  other roles, such as service outages, pipeline decisions or outputs relied on,
  {{loss_component:provider_civil_fine}} and the legal resources of every claim, enforcement action
  and recovery effort the incident causes. Count each underlying loss once: settlements,
  reimbursements, recoveries and other compensation for already-counted harm are not more loss.
  Costs are incremental relative to the same activity without the incident: scheduled control
  resources unchanged in that counterfactual are excluded, and incident-triggered response or
  recovery resources are included even when existing staff perform them.
# A person relies on erroneous other-field output; the harm falls on them and those their decisions affect.
facets:
  peril_mechanism: ["erroneous_output_reliance"]
  deployment_control_mode: "api"
  harm_types: ["economic_loss"]
  bearers: ["third_party_organizations", "third_party_individuals", "provider"]
  party_basis: "third_party"
occurrence_unit_id: "output_reliance_other_incident"
attribution_nexus:
  kind: "model_contribution"
  terminal_qualification: >-
    The erroneous output relied on is produced by the assigned provider's model.
estimand_composition:
  roster: "standard"
event_chain:
  opportunity:
    unit: >-
      One material error in output of the named lab's model in the named deployment, in a field
      other than health, law, finance or software, that a professional or member of the public acts
      on before anyone catches it: an engineering, research, regulatory or everyday decision is
      made, or a deliverable or submission is delivered. One identified defect producing such errors
      counts once, when the first reliance takes effect.
    counting_rule: >-
      Count one opportunity per root cause; a defect reaching many deployments or decisions is one
      opportunity. Each yields at most one qualified incident.
    cohort: >-
      Root causes active during the study year whose first loss has not occurred in an earlier year;
      membership does not depend on later success.
  exposure:
    public:
      unit: "1 million weekly active users of the consumer assistant"
      basis: "judgment"
      count:
        kind: "derived"
        scale_id: "consumer_weekly_users"
        factor: 1.0e-6
        rationale: >-
          Members of the public relying on the consumer assistant are the largest population acting
          on the model's output; professionals using business plans and products built on the API
          are included in the rate.
        source: >-
          INITIAL_ESTIMATE: no public data measure how often model output is acted on; the count is
          the stipulated user base.
      derivation: >-
        The stipulated number of weekly active users of the consumer assistant divided by 1 million.
    internal:
      unit: "1,000 lab staff"
      basis: "normalisation"
      count:
        kind: "derived"
        scale_id: "lab_staff"
        factor: 1.0e-3
        rationale: >-
          Output of not-yet-public models is relied on by lab staff and, under agreement, by a few
          hundred external testers; the study stipulates that this use moves with staff.
        source: "INITIAL_ESTIMATE: normalisation by staff."
      derivation: "The stipulated number of lab staff divided by 1,000."
  stages:
    - stage_id: "loss_or_response"
      event: >-
        The reliance causes a loss or adverse consequence for someone, or needs correction, response
        or legal work specific to it.
empirical_grounding: >-
  No governed dataset supports this population. Professional-liability claims in other fields are
  analogs.
