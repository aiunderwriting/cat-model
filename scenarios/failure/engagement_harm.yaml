id: "engagement_harm"
name: "Harm from Engagement with the Model"
node_ids: ["n_failure_engagement_harm"]
lineage:
  introduced_in: "r1"
description: >-
  A person's engagement with the provider's model, on any topic, harms that person's mental health:
  the harm arises from what the interaction does to the person, such as reinforcing self-harm,
  dependence or delusion, and not from a decision made on erroneous output. What the person then
  does to themself or to others belongs to the incident. One person's history is one incident, and
  one identified defect, such as a feature that repeatedly steers conversations toward self-harm,
  is one incident across everyone it harms. Erroneous clinical, medication or mental-health
  information that a person acts on is reliance on health output.
severity_governance:
  policy: "governed_tail_shape"
  tail_class: "cyber_operational"
  tail_class_rationale: >-
    One identified defect is one incident, so the largest incidents merge the injuries of everyone
    it harmed. One person's harm is bounded like an injury claim, but that bound does not hold for a
    merged defect. The lower tail-shape alternative, 0.5, covers the reading that single-person
    incidents dominate even the far tail.
  cap_posture: "uncapped"
  evidence_refs: ["assumptions.md#severity-and-tails"]
frequency_semantics:
  counting_identity: >-
    One incident is one root cause: one erroneous output or action history, or one identified defect
    in a shared model, configuration, prompt or tool interface, from its first loss to its
    correction, across every affected deployment, organization and party. Use of the same model
    alone does not establish a shared defect; independent errors without one identified defect are
    separate incidents, including several in one deployment in one year. A design or behavior is an
    identified defect only when a specific, correctable model, version, feature or configuration
    property is shown or acknowledged to cause the harms; a pleaded theory alone does not merge
    losses into one incident.
  terminal_event_unit: >-
    One admitted engagement-harm incident: one root cause in which a person's engagement with the
    selected provider's model, whatever its topic, harms that person's mental health, the largest
    share of whose gross loss arises from that engagement, and {{admission}}. The whole incident,
    across every harmed person, and all its consequences belong here. Harm from what the interaction
    does to a person's mental health, such as reinforced self-harm, dependence or delusion, belongs
    here, and harm from acting on the model's clinical, medication or mental-health output is a
    health-reliance incident, whatever behavior of the model a claim pleads. A claim or enforcement
    action alleging bodily or psychological injury or death of identified persons from the model's
    outputs follows the incident that injured them, whatever theory is pleaded; product and consumer
    claims, and enforcement, cover matters without such injury incidents. One enforcement action
    over a practice that cites such injuries from several separately counted incidents is an
    enforcement matter, and its fines and costs are part of none of those incidents. An incident
    below the admission threshold is the unestimated leftover, not this scenario's incident.
  year_rule: >-
    An incident is assigned to the year its first loss occurs; later losses, claims, fines and
    recoveries stay with it and never create another unit.
severity_occurrence_scope: >-
  The complete gross loss of one admitted incident across every harmed person and other affected
  party, before any recovery: injury and fatality valuation, additional care, lost productive
  output, the provider's correction, losses the same root cause causes through other roles, such as
  outputs relied on, {{loss_component:provider_civil_fine}} and the legal resources of every
  claim, enforcement action and recovery effort the incident causes, including claims and
  enforcement over the injuries. Count each underlying loss once: settlements, reimbursements,
  recoveries and other compensation for already-counted harm are not more loss. Costs are
  incremental relative to the same activity without the incident: scheduled control resources
  unchanged in that counterfactual are excluded, and incident-triggered response or recovery
  resources are included even when existing staff perform them.
# Engagement with the model harms the person engaging with it.
facets:
  peril_mechanism: ["harmful_engagement"]
  deployment_control_mode: "api"
  harm_types: ["bodily_injury", "economic_loss"]
  bearers: ["third_party_individuals", "third_party_organizations", "provider"]
  party_basis: "third_party"
occurrence_unit_id: "engagement_harm_incident"
attribution_nexus:
  kind: "model_contribution"
  terminal_qualification: >-
    The model whose engagement harms the person is the assigned provider's.
estimand_composition:
  roster: "standard"
event_chain:
  opportunity:
    unit: >-
      One case in which a person's engagement with the named lab's model in the named deployment,
      on any topic, becomes harmful to their mental health, counted when the harmful engagement
      begins.
    counting_rule: >-
      Count one opportunity per engagement history, or one per identified shared defect, across
      every affected person; later harm does not decide membership. Each yields at most one
      qualified incident.
    cohort: >-
      Cases arising during the study year, or carried in from an earlier year without loss yet;
      membership does not depend on later harm.
  exposure:
    public:
      unit: "1 million weekly active users of the consumer assistant"
      basis: "judgment"
      count:
        kind: "derived"
        scale_id: "consumer_weekly_users"
        factor: 1.0e-6
        rationale: >-
          Sustained engagement arises in consumer-assistant use, so weekly users count the people at
          risk; people who use products built on the API are included in the rate.
        source: >-
          INITIAL_ESTIMATE: no public data measure how often engagement with a model harms a user;
          the count is the stipulated user base.
      derivation: >-
        The stipulated number of weekly active users of the consumer assistant divided by 1 million.
    internal:
      unit: "1,000 lab staff"
      basis: "normalisation"
      count:
        kind: "derived"
        scale_id: "lab_staff"
        factor: 1.0e-3
        rationale: >-
          Not-yet-public models are used by lab staff and, under agreement, by a few hundred
          external testers; the study stipulates that this use moves with staff.
        source: "INITIAL_ESTIMATE: normalisation by staff."
      derivation: "The stipulated number of lab staff divided by 1,000."
  stages:
    - stage_id: "person_harmed"
      event: >-
        The person suffers psychological harm, harms themself or someone else, or needs care because
        of it, or the case needs response or legal work specific to it.
empirical_grounding: >-
  No dataset measures how often engagement with a model harms a user or what such incidents cost.
  Lawsuits, press investigations, psychiatric record reviews and providers' own estimates of risk
  signals among their users describe the mechanism; none is a count of incidents or a loss sample,
  and none establishes causation.
