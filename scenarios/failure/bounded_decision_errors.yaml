id: "bounded_decision_errors"
name: "Bounded Decision Pipeline Errors"
node_ids: ["n_failure_bounded_decision"]
lineage:
  introduced_in: "r1"
description: >-
  A predefined, non-agentic pipeline built on the provider's model makes or executes erroneous
  decisions within its permitted actions: eligibility decisions on credit, insurance, benefits or
  employment, content moderation and platform governance, market or treasury execution, and other
  bounded tasks. Physical control belongs to its own leaf. The decision function is an attribute of
  the history, not a split. One defect in a shared model, configuration or scoring package at many
  deployments is one incident with whole-incident severity, not many independent incidents.
severity_governance:
  policy: "governed_tail_shape"
  tail_class: "cyber_operational"
  tail_class_rationale: >-
    One defect at many deployments is one incident, so the largest incidents spread loss across
    deployments and the parties they decide for as a defect in relied-on software does. One
    deployment's loss is bounded by its decision volume and its operator's balance sheet, but that
    bound does not hold for a merged defect. The lower tail-shape alternative, 0.5, covers the
    reading that single-deployment incidents dominate even the far tail.
  cap_posture: "uncapped"
  evidence_refs: ["assumptions.md#severity-and-tails"]
frequency_semantics:
  counting_identity: >-
    One incident is one root cause: one erroneous output or action history, or one identified defect
    in a shared model, configuration, prompt or tool interface, from its first loss to its
    correction, across every affected deployment, organization and party. Use of the same model
    alone does not establish a shared defect; independent errors without one identified defect are
    separate incidents, including several in one deployment in one year. A design or behavior is an
    identified defect only when a specific, correctable model, version, feature or configuration
    property is shown or acknowledged to cause the harms; a pleaded theory alone does not merge
    losses into one incident.
  terminal_event_unit: >-
    One admitted pipeline-error incident: one root cause in which predefined, non-agentic pipelines
    built on the selected provider's model make or execute erroneous decisions within their
    permitted actions, the largest share of whose gross loss arises from those erroneous decisions,
    and {{admission}}. A decision is erroneous when the facts of the case did not support it under
    the rules it was meant to apply; one that is unlawful only because no person took part in it, or
    only because of a policy its deployer chose, is not. The whole incident, across every affected
    deployment, and all its consequences belong here. In this scenario a pipeline's output takes
    effect without a person considering that individual output, including under automatic or bulk
    approval; where a person considers the output and acts on it, however carelessly, the incident
    is reliance on output. An incident below the admission threshold is the unestimated leftover,
    not this scenario's incident.
  year_rule: >-
    An incident is assigned to the year its first loss occurs; later losses, claims, fines and
    recoveries stay with it and never create another unit.
severity_occurrence_scope: >-
  The complete gross loss of one admitted incident across every affected deployment, organization
  and party, before any recovery: the harm to people and organizations subject to its erroneous
  decisions, operators' correction, re-review and remediation, outage losses and other losses the
  same root cause causes through other roles, such as service outages, pipeline decisions or outputs
  relied on, injury where caused, {{loss_component:provider_civil_fine}} and the legal resources of
  every claim, enforcement action and recovery effort the incident causes. Count each underlying
  loss once: settlements, reimbursements, recoveries and other compensation for already-counted harm
  are not more loss. Costs are incremental relative to the same activity without the incident:
  scheduled control resources unchanged in that counterfactual are excluded, and incident-triggered
  response or recovery resources are included even when existing staff perform them.
# Erroneous bounded-pipeline decisions harm subjects and operators at each affected deployment.
facets:
  peril_mechanism: ["bounded_pipeline_error", "discriminatory_output", "shared_component_defect"]
  deployment_control_mode: "api"
  harm_types: ["economic_loss", "discrimination_harm"]
  bearers:
    - "deployer_or_customer"
    - "third_party_individuals"
    - "third_party_organizations"
    - "provider"
  party_basis: "third_party"
occurrence_unit_id: "pipeline_error_incident"
attribution_nexus:
  kind: "model_contribution"
  terminal_qualification: >-
    The assigned provider's model produces the erroneous decisions or executions of the affected
    pipeline, whether the cause lies in the model or in the deployer's prompt, inputs or
    configuration.
estimand_composition:
  roster: "standard"
event_chain:
  opportunity:
    unit: >-
      One root cause of erroneous decisions in predefined, non-agentic pipelines built on the named
      lab's model in the named deployment, such as a flawed prompt, model update, configuration or
      scoring package, counted when it first produces an erroneous decision, such as a denied
      application, a removed post or an executed trade, whether the decision takes effect or is
      intercepted.
    counting_rule: >-
      Count one opportunity per root cause; a defect reaching many deployments or decisions is one
      opportunity. Each yields at most one qualified incident.
    cohort: >-
      Root causes active during the study year whose first loss has not occurred in an earlier year;
      membership does not depend on later success.
  exposure:
    public:
      unit: "business customer running a decision pipeline built on the lab's models in production"
      basis: "judgment"
      count:
        kind: "derived"
        scale_id: "paying_business_customers"
        factor: 0.1
        rationale: >-
          Bounded pipelines that decide eligibility, moderate content or execute trades are built by
          business customers; about one in ten paying business customers is taken to run one in
          production during the study year.
        source: >-
          INITIAL_ESTIMATE: no public census counts production decision pipelines on one lab's
          models.
      derivation: >-
        About 10% of the stipulated paying business customers run a decision pipeline built on the
        lab's models in production.
    internal:
      unit: "1,000 lab staff"
      basis: "normalisation"
      count:
        kind: "derived"
        scale_id: "lab_staff"
        factor: 1.0e-3
        rationale: >-
          The lab's own pipelines on not-yet-public models, such as data filtering, labelling and
          moderation, are built and run by its staff.
        source: "INITIAL_ESTIMATE: normalisation by staff; the context gives no pipeline count."
      derivation: "The stipulated number of lab staff divided by 1,000."
  stages:
    - stage_id: "harm_or_remediation"
      event: >-
        The erroneous decisions harm someone, or require re-review, correction, remediation or legal
        work beyond the pipeline's routine checks.
empirical_grounding: >-
  No governed dataset supports this population. Automated-decision enforcement cases and
  conventional trading failures are mechanism context, not a frequency or loss sample.
