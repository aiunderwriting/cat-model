id: "compromise_self_propagating"
name: "Self-Propagating System Compromise"
node_ids: ["n_compromise_self_propagating"]
lineage:
  introduced_in: "r1"
description: >-
  An attacker materially assisted by any copy of the provider's model builds or releases malicious
  code that spreads from system to system on its own, without the attacker choosing each victim,
  such as a worm that encrypts, wipes or corrupts data, enlists the systems it reaches or floods
  their networks, and that spread causes most of the incident's loss. One outbreak is one incident
  across every system, organization and country it reaches, its reach part of severity. Who bears
  the loss does not decide the leaf: an outbreak that hits hospitals, shippers and manufacturers
  alike belongs here. A campaign the attacker operates against each victim, including mass
  exploitation of one vulnerability and a compromised vendor or update channel, is a directed
  compromise unless the code's own spread causes most of the loss. Code that spreads between
  deployed AI systems through their inputs is a hijack, and a model copying itself is a loss of
  developer control. Novel and known vulnerabilities, the payload and the actor's skill are
  attributes of the history, not splits.
severity_governance:
  policy: "governed_tail_shape"
  tail_class: "cyber_operational"
  tail_class_rationale: >-
    One outbreak accumulates loss across every organization that runs the vulnerable software, the
    propagation across organizations that the cyber class describes.
  cap_posture: "uncapped"
  evidence_refs: ["assumptions.md#severity-and-tails"]
frequency_semantics:
  counting_identity: >-
    One campaign is one unit: one causally coherent operation, identified by a shared plan, access
    chain, pretext or payload, across every target, victim, system and affected party. An actor or
    generic toolkit shared by independent plans does not merge them. Causally distinct campaigns are
    separate units, including several by one actor in one year.
  terminal_event_unit: >-
    One admitted self-propagating compromise: a campaign in which an attacker materially assisted by
    any copy of the selected provider's model, however the attacker obtained it (served, stolen,
    leaked or open weights) releases malicious code that spreads from system to system on its own,
    the largest share of whose gross loss arises from that spread, whoever bears it, and
    {{admission}}. Assistance is material when it gives the attacker capability, scale or speed that
    the attacker would not have had without any AI model, and the loss, or more than half of it,
    would not have occurred without that gain. The comparison is with what the same attacker would
    in fact have had if no generative AI model of any developer, voice and image generators
    included, had been available to it: its own skills and staff, software in ordinary use before
    such models, such as search engines and translation software, and whatever it would have bought
    or hired instead. Help that it would then have had anyway, as good, as fast and at the same
    scale, such as tidying a message's wording or answering what a web search would have answered,
    is not material even when the campaign uses it. That another AI model could have given the same
    help does not make it less material. A campaign that used the model's help without material
    assistance is not this scenario's incident and, unless it meets another scenario's own
    conditions, such as a hijacked AI system or an AI failure that the attacker exploited, is
    counted in no scenario and no category. The whole incident and all its consequences belong here.
    An intrusion, fraud or influence operation that is part of a CBRN program belongs to that
    program. An incident below the admission threshold is the unestimated leftover, not this
    scenario's incident.
  year_rule: >-
    An incident is assigned to the year its first loss occurs; later losses, claims, fines and
    recoveries stay with it and never create another unit.
severity_occurrence_scope: >-
  The complete gross loss of one admitted incident across all affected parties and loss kinds,
  before any recovery: victims' response, restoration and interruption, stolen funds or assets,
  ransom, transfers made by people deceived during the campaign, data disclosure and destruction,
  physical damage and injury where caused, {{loss_component:provider_civil_fine}} and the legal
  resources of every claim, enforcement action and recovery effort the incident causes. Count each
  underlying loss once: settlements, reimbursements, recoveries and other compensation for
  already-counted harm are not more loss. Costs are incremental relative to the same activity
  without the incident: scheduled control resources unchanged in that counterfactual are excluded,
  and incident-triggered response or recovery resources are included even when existing staff
  perform them.
# An attacker's model-assisted code spreads on its own and causes loss wherever it lands.
facets:
  peril_mechanism: ["technical_intrusion"]
  deployment_control_mode: "any_copy"
  harm_types: ["economic_loss"]
  bearers: ["third_party_organizations", "third_party_individuals", "general_public", "provider"]
  party_basis: "third_party"
occurrence_unit_id: "compromise_self_propagating_incident"
attribution_nexus:
  kind: "model_contribution"
  terminal_qualification: >-
    A copy of the assigned provider's model, however the attacker obtained it, materially assists
    the campaign's vulnerability discovery, exploit development, propagation code, payload or
    release. The model behind a victim's own deployed AI system that the campaign uses is such a
    copy, and the comparison is then with the campaign without what that system gave up or did for
    the attacker.
estimand_composition:
  roster: "standard"
event_chain:
  opportunity:
    unit: >-
      One hostile effort to build or release malicious code that spreads from system to system on
      its own, that uses help from a copy of the named lab's model, such as code, analysis or
      instructions, whether served in the named deployment or stolen, leaked or open, counted when
      it first uses that help. Any use of the model's help counts here, however small. The first
      stage asks only whether the help gave a gain; that the loss, or more than half of it, would
      not have occurred without that gain is part of the last stage, the qualified unit.
    counting_rule: >-
      Count one opportunity per causally coherent effort; distinct efforts by one actor are
      separate. Each effort yields at most one qualified incident.
    cohort: >-
      Efforts active during the study year whose first loss has not occurred in an earlier year;
      membership does not depend on later success.
  exposure:
    public:
      unit: "1 million weekly active users of the consumer assistant"
      basis: "judgment"
      count:
        kind: "derived"
        scale_id: "consumer_weekly_users"
        factor: 1.0e-6
        rationale: >-
          Misusing actors are a small share of the people who use the lab's models, and weekly users
          are the broadest stipulated measure of that population; campaigns using stolen, leaked or
          open copies are included in the rate.
        source: >-
          INITIAL_ESTIMATE: published threat-intelligence reports describe disrupted misuse
          operations, not a rate per user.
      derivation: >-
        The stipulated number of weekly active users of the consumer assistant divided by 1 million.
    internal:
      unit: >-
        not-yet-public model of the lab in training, evaluation, internal use or pre-release testing
        during the study year
      basis: "judgment"
      count:
        kind: "fixed"
        count: 6
        rationale: >-
          Campaigns can reach a not-yet-public model through pre-release tester access, an insider
          or a stolen copy; each route is specific to a model, so the number of not-yet-public
          models measures exposure better than staff. About six are in use at some time in the year.
        source: >-
          INITIAL_ESTIMATE: no public census of frontier labs' unreleased models exists; the
          stipulated context describes successors to the public model line in training, evaluation,
          internal use and pre-release testing.
      derivation: >-
        Fixed by the scenario at six not-yet-public models in use at some time during the year.
  stages:
    - stage_id: "uplift"
      event: >-
        The model's help gives the attacker capability, scale or speed that the attacker would not
        have had without any AI model.
    - stage_id: "spreading_method_obtained"
      event: >-
        The effort obtains a working way for its code to spread from one system to the next without
        the attacker's action, such as an exploit of a vulnerability that needs no action by a user,
        whether it develops, buys, steals or reuses one.
    - stage_id: "code_released"
      event: >-
        Code that spreads on its own by that method is released outside a test environment.
empirical_grounding: >-
  No governed dataset isolates AI-assisted self-propagating code. Published accounts of past worm
  outbreaks give counts and loss estimates for all causes, and a published risk model describes,
  for the largest data-damaging worms, how assistance with exploit development could change who
  can build such code. Advisories and vendor analyses of self-replicating code in package
  registries give neither victim counts nor losses; none of these calibrates this population.
