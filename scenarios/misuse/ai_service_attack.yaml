id: "ai_service_attack"
name: "Attack on the AI Service"
node_ids: ["n_asset_service_attack"]
lineage:
  introduced_in: "r1"
description: >-
  The AI service is the target: an attacker disrupts or intrudes on the provider's service itself,
  for example by denial of service or intrusion into its serving infrastructure, including when the
  attacker had model help. Only the attack's own losses count here: the provider's response and
  restoration, customers' interruption and the consequences of data taken from the service. A
  non-hostile outage is a service failure; an intrusion whose largest loss is model artifacts taken
  is a theft; an attack that makes a deployed model act for the attacker is a hijack or tampering.
severity_governance:
  policy: "governed_tail_shape"
  tail_class: "cyber_operational"
  tail_class_rationale: >-
    An attack on the service can interrupt the whole customer base, an operational loss of the cyber
    class.
  cap_posture: "uncapped"
  evidence_refs: ["assumptions.md#severity-and-tails"]
frequency_semantics:
  counting_identity: >-
    One campaign is one unit: one causally coherent operation, identified by a shared plan, access
    chain, pretext or payload, across every target, victim, system and affected party. An actor or
    generic toolkit shared by independent plans does not merge them. Causally distinct campaigns are
    separate units, including several by one actor in one year.
  terminal_event_unit: >-
    One admitted service-attack incident: a campaign that disrupts or intrudes on the selected
    provider's AI service, with or without model help, the largest share of whose gross loss is the
    attack's own, and {{admission}}. Where one campaign attacks several providers, this scenario's
    incident is its attack on the selected provider's service, with the loss that attack causes. A
    campaign whose loss arises mostly from model artifacts taken is a theft. Use of the service
    through credentials stolen from its customers is by itself a system compromise of those
    customers, not an attack on the service. Copying a model's behavior through the provider's
    service, by distillation or extraction, is neither a theft of artifacts nor an attack on the
    service. An incident below the admission threshold is the unestimated leftover, not this
    scenario's incident.
  year_rule: >-
    An incident is assigned to the year its first loss occurs; later losses, claims, fines and
    recoveries stay with it and never create another unit.
severity_occurrence_scope: >-
  The complete gross loss of one admitted campaign's own consequences across all affected parties,
  before any recovery: the provider's investigation, response and restoration, customers'
  interruption from the attack, consequences of data taken from the service,
  {{loss_component:provider_civil_fine}} and the legal resources of every claim, enforcement action
  and recovery effort the incident causes. Count each underlying loss once: settlements,
  reimbursements, recoveries and other compensation for already-counted harm are not more loss.
  Costs are incremental relative to the same activity without the incident: scheduled control
  resources unchanged in that counterfactual are excluded, and incident-triggered response or
  recovery resources are included even when existing staff perform them.
# The provider's service is the target; the provider and the customers who depend on it bear the loss.
facets:
  peril_mechanism: ["technical_intrusion"]
  deployment_control_mode: "api"
  harm_types: ["economic_loss"]
  bearers: ["provider", "deployer_or_customer", "third_party_organizations"]
  party_basis: "first_party"
occurrence_unit_id: "ai_service_attack_incident"
attribution_nexus:
  kind: "model_contribution"
  terminal_qualification: >-
    The attacked service is the assigned provider's.
estimand_composition:
  roster: "standard"
event_chain:
  opportunity:
    unit: >-
      One hostile campaign to disrupt or intrude on the named lab's AI service, counted when the
      campaign first acts.
    counting_rule: >-
      Count one opportunity per causally coherent campaign; distinct campaigns by one actor are
      separate. Each campaign yields at most one qualified incident.
    cohort: >-
      Campaigns active during the study year whose first loss has not occurred in an earlier year;
      membership does not depend on later success.
  exposure:
    public:
      unit: "1 million weekly active users of the consumer assistant"
      basis: "normalisation"
      count:
        kind: "derived"
        scale_id: "consumer_weekly_users"
        factor: 1.0e-6
        rationale: >-
          Attacks on the lab's service follow the service's prominence, which weekly users measure;
          the driver is a normalisation.
        source: >-
          INITIAL_ESTIMATE: attacks on online services establish the mechanism, not a rate per user.
      derivation: >-
        The stipulated number of weekly active users of the consumer assistant divided by 1 million.
    internal:
      unit: "1,000 lab staff"
      basis: "normalisation"
      count:
        kind: "derived"
        scale_id: "lab_staff"
        factor: 1.0e-3
        rationale: >-
          Internal and pre-release use has one stipulated scale, lab staff, so the internal rate is
          per 1,000 lab staff; no scale counts attacks on the systems that serve not-yet-public
          models, so the base is a normalisation.
        source: >-
          INITIAL_ESTIMATE: no rate of attacks on internal serving systems is published.
      derivation: "The stipulated number of lab staff divided by 1,000."
  stages:
    - stage_id: "attack_reaches_service"
      event: >-
        The attack reaches the serving infrastructure: its traffic arrives at the service, or the
        attacker gains unauthorized access to it.
    - stage_id: "service_or_data_compromised"
      event: >-
        The attack degrades or interrupts the service for customers, or data leaves the service.
empirical_grounding: >-
  No governed dataset supports this population. Providers' public status records attribute some
  disruptions of AI services to attack traffic; they state no cost and are not a count of attacks.
  Loss evidence comes from attacks on other online services.
