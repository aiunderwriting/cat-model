id: "fraud_organizations"
name: "Fraud Against Organizations"
node_ids: ["n_fraud_organizations"]
lineage:
  introduced_in: "r1"
description: >-
  An attacker materially assisted by any copy of the provider's model deceives an organization's
  staff into transferring its value: payments to a spoofed payee, a deceived custody signer
  approving a transfer, procurement deception, or an insurer paying a claim supported by fabricated
  evidence. A technically compromised mailbox used to send deceptive payment instructions remains
  fraud, because the deceived approval moves the money; granting credentials that the attacker then
  uses is system compromise.
severity_governance:
  policy: "governed_tail_shape"
  tail_class: "cyber_operational"
  tail_class_rationale: >-
    A fraud campaign accumulates transfers and response costs across its victims.
  cap_posture: "uncapped"
  evidence_refs: ["assumptions.md#severity-and-tails"]
frequency_semantics:
  counting_identity: >-
    One campaign is one unit: one causally coherent operation, identified by a shared plan, access
    chain, pretext or payload, across every target, victim, system and affected party. An actor or
    generic toolkit shared by independent plans does not merge them. Causally distinct campaigns are
    separate units, including several by one actor in one year.
  terminal_event_unit: >-
    One admitted fraud incident against organizations: a campaign in which an attacker materially
    assisted by any copy of the selected provider's model, however the attacker obtained it
    (served, stolen, leaked or open weights) deceives or coerces people into transferring value,
    such as funds, assets or approval of a payment to a false payee or for a false purpose, the
    largest share of whose gross loss is organizations' transferred value and its consequences, and
    {{admission}}. Assistance is material when it gives the attacker capability, scale or speed
    that the attacker would not have had without any AI model, and the loss, or more than half of
    it, would not have occurred without that gain. The comparison is with what the same attacker
    would in fact have had if no generative AI model of any developer, voice and image generators
    included, had been available to it: its own skills and staff, software in ordinary use before
    such models, such as search engines and translation software, and whatever it would have bought
    or hired instead. Help that it would then have had anyway, as good, as fast and at the same
    scale, such as tidying a message's wording or answering what a web search would have answered,
    is not material even when the campaign uses it. That another AI model could have given the same
    help does not make it less material. A campaign that used the model's help without material
    assistance is not this scenario's incident and, unless it meets another scenario's own
    conditions, such as a hijacked AI system or an AI failure that the attacker exploited, is
    counted in no scenario and no category. The whole campaign and all its consequences belong
    here. A campaign whose loss arises mostly from transfers or approvals that people were deceived
    into making is fraud, even when a compromised mailbox or account delivered the deception;
    extortion over systems or data that the attacker compromised, and the attacker's use of
    credentials or access that a deceived person handed over, are system compromise. An intrusion,
    fraud or influence operation that is part of a CBRN program belongs to that program. An
    incident below the admission threshold is the unestimated leftover, not this scenario's
    incident.
  year_rule: >-
    An incident is assigned to the year its first loss occurs; later losses, claims, fines and
    recoveries stay with it and never create another unit.
severity_occurrence_scope: >-
  The complete gross loss of one admitted campaign across all victims and loss kinds, before any
  recovery of principal: transferred funds and assets, fraudulently paid claims, intrusion,
  restoration and ransom losses and market-manipulation and trading losses in the same campaign,
  victims' investigation and response, injury where caused, {{loss_component:provider_civil_fine}}
  and the legal resources of every claim, enforcement action and recovery effort the incident
  causes. Count each underlying loss once: settlements, reimbursements, recoveries and other
  compensation for already-counted harm are not more loss. Costs are incremental relative to the
  same activity without the incident: scheduled control resources unchanged in that counterfactual
  are excluded, and incident-triggered response or recovery resources are included even when
  existing staff perform them.
# Model-assisted deception or coercion induces victims to transfer value to the attacker.
facets:
  peril_mechanism: ["deception_of_humans"]
  deployment_control_mode: "any_copy"
  harm_types: ["financial_theft", "economic_loss"]
  bearers: ["third_party_organizations", "provider"]
  party_basis: "third_party"
occurrence_unit_id: "fraud_organizations_campaign"
attribution_nexus:
  kind: "model_contribution"
  terminal_qualification: >-
    A copy of the assigned provider's model, however the attacker obtained it, materially assists
    the campaign's deception or coercion, for example by writing in a language or at a quality the
    attacker could not, imitating voices or faces, or running conversations at a scale its staff
    could not.
estimand_composition:
  roster: "standard"
event_chain:
  opportunity:
    unit: >-
      One fraud campaign aimed at organizations' value that uses help from a copy of the named lab's
      model in its content, planning, targeting or scale, whether served in the named deployment or
      stolen, leaked or open, and whose deception or coercion reaches at least one intended victim,
      counted when it first does. Any use of the model's help counts here, however small. The first
      stage asks only whether the help gave a gain; that the loss, or more than half of it, would
      not have occurred without that gain is part of the last stage, the qualified unit.
    counting_rule: >-
      Count one opportunity per causally coherent campaign; distinct campaigns by one actor are
      separate. Each campaign yields at most one qualified incident.
    cohort: >-
      Campaigns active during the study year whose first loss has not occurred in an earlier year;
      membership does not depend on later success.
  exposure:
    public:
      unit: "1 million weekly active users of the consumer assistant"
      basis: "judgment"
      count:
        kind: "derived"
        scale_id: "consumer_weekly_users"
        factor: 1.0e-6
        rationale: >-
          Misusing actors are a small share of the people who use the lab's models, and weekly users
          are the broadest stipulated measure of that population; campaigns using stolen, leaked or
          open copies are included in the rate.
        source: >-
          INITIAL_ESTIMATE: published threat-intelligence reports describe disrupted misuse
          operations, not a rate per user.
      derivation: >-
        The stipulated number of weekly active users of the consumer assistant divided by 1 million.
    internal:
      unit: >-
        not-yet-public model of the lab in training, evaluation, internal use or pre-release testing
        during the study year
      basis: "judgment"
      count:
        kind: "fixed"
        count: 6
        rationale: >-
          Campaigns can reach a not-yet-public model through pre-release tester access, an insider
          or a stolen copy; each route is specific to a model, so the number of not-yet-public
          models measures exposure better than staff. About six are in use at some time in the year.
        source: >-
          INITIAL_ESTIMATE: no public census of frontier labs' unreleased models exists; the
          stipulated context describes successors to the public model line in training, evaluation,
          internal use and pre-release testing.
      derivation: >-
        Fixed by the scenario at six not-yet-public models in use at some time during the year.
  stages:
    - stage_id: "uplift"
      event: >-
        The model's help gives the attacker capability, scale or speed that the attacker would not
        have had without any AI model.
    - stage_id: "value_transferred"
      event: >-
        At least one organization's staff transfer funds or assets, or approve a payment, because of
        the campaign's deception or coercion.
empirical_grounding: >-
  No governed dataset isolates AI-assisted fraud against organizations. Complaint statistics on
  business email compromise describe the losses reported in each complaint, not campaign totals;
  where they flag complaints that mention AI, the flag records a reference, not verified use, and
  names no model. Press and court accounts of large impersonation frauds with cloned voices or
  faces do not name the tool used.
