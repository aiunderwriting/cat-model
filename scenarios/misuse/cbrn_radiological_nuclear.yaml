id: "cbrn_radiological_nuclear"
name: "Radiological or Nuclear Weapons Program"
node_ids: ["n_cbrn_radiological_nuclear"]
lineage:
  introduced_in: "r1"
description: >-
  A radiological or nuclear weapons program is materially assisted by any copy of the provider's
  model, including stolen or open weights. Admitted outcomes range from response-only costs after
  interdiction to mass-casualty catastrophes; the program owns all its supporting operations.
severity_governance:
  policy: "governed_tail_shape"
  tail_class: "mass_casualty_catastrophe"
  tail_class_rationale: >-
    A nuclear explosive or radiological dispersal can cause mass casualties and long-lived
    contamination.
  evidence_refs: ["assumptions.md#severity-and-tails"]
frequency_semantics:
  counting_identity: >-
    One counted incident is one coordinated weapons program, including its supporting operations,
    all attacks or releases (including accidental releases), interdiction and response. A program
    may end at interdiction; no attack or release is required. Distinct programs count separately,
    even for one actor in one year; events within a program do not.
  terminal_event_unit: >-
    One admitted incident of a radiological or nuclear weapons program materially assisted by any
    copy of the selected provider's model, however the program obtained it (served, stolen, leaked
    or open weights), whose interdiction, response or attack causes gross loss, and {{admission}},
    whether or not realized harm reaches mass-casualty scale. Assistance is material when it gives
    the program capability, scale or speed that the program would not have had without any AI model,
    and the loss, or more than half of it, would not have occurred without that gain. The comparison
    is with what the same program would in fact have had if no generative AI model of any developer
    had been available to it: its own skills and staff, software in ordinary use before such models,
    such as search engines and translation software, and whatever it would have bought or hired
    instead. Help that it would then have had anyway, as good, as fast and at the same scale, such
    as an answer that a web search would have given, is not material even when the program uses it.
    That another AI model could have given the same help does not make it less material. A program
    that used the model's help without material assistance is not this scenario's incident and,
    unless it meets another scenario's own conditions, is counted in no scenario and no category.
    The whole program and all its consequences belong here. An incident below the admission
    threshold is the unestimated leftover, not this scenario's incident.
  year_rule: >-
    An incident is assigned to the year its first loss occurs; later losses, claims, fines and
    recoveries stay with it and never create another unit.
severity_occurrence_scope: >-
  Severity quantiles describe the full admitted range, from response-only costs to mass-casualty
  catastrophes, including rare outcomes beyond historical experience.
  The complete gross loss of one admitted program across all affected parties and loss kinds, before
  any recovery: casualties' injury and fatality valuation, health care, decontamination, property
  damage and interruption, public-health and security response, interdiction and investigation, the
  stolen or transferred value and the response and notification costs of victims of the program's
  supporting intrusion, fraud or deception, {{loss_component:provider_civil_fine}} and the legal
  resources of every claim, enforcement action and recovery effort the incident causes. Count each
  underlying loss once: settlements, reimbursements, recoveries and other compensation for
  already-counted harm are not more loss. Costs are incremental relative to the same activity
  without the incident: scheduled control resources unchanged in that counterfactual are excluded,
  and incident-triggered response or recovery resources are included even when existing staff
  perform them.
# Model uplift to a weapons program causes casualties, response and interdiction loss.
facets:
  peril_mechanism: ["capability_uplift"]
  deployment_control_mode: "any_copy"
  harm_types: ["bodily_injury", "property_damage", "economic_loss"]
  bearers:
    - "third_party_individuals"
    - "third_party_organizations"
    - "general_public"
    - "provider"
  party_basis: "third_party"
occurrence_unit_id: "cbrn_radiological_nuclear_program"
attribution_nexus:
  kind: "model_contribution"
  terminal_qualification: >-
    A copy of the assigned provider's model, however the program obtained it, materially assists the
    program.
estimand_composition:
  roster: "standard"
event_chain:
  opportunity:
    unit: >-
      One whole radiological or nuclear weapons program that uses help from a copy of the named
      lab's model, whether served in the named deployment or stolen, leaked or open, counted when it
      first uses that help, whether or not loss follows. Any use of the model's help counts here,
      however small. The first stage asks only whether the help gave a gain; that the loss, or more
      than half of it, would not have occurred without that gain is part of the last stage, the
      qualified unit.
    counting_rule: >-
      Count one opportunity per whole program; distinct programs count separately. Each
      yields at most one admitted incident.
    cohort: >-
      Programs active during the study year whose first loss has not occurred in an earlier
      year; membership does not depend on later success.
  exposure:
    public:
      unit: "paying business customer of the lab"
      basis: "judgment"
      count:
        kind: "derived"
        scale_id: "paying_business_customers"
        factor: 1.0
        rationale: >-
          Professional and institutional reach is the reference population for this scenario;
          the stipulated business customer count includes government as well as private users.
          Each customer is one base unit. The opportunity rate covers all in-scope programs and
          copies of the model, without requiring a program to be a paying customer; the base
          does not assume that any given customer has hostile intent or expertise.
        source: >-
          INITIAL_ESTIMATE reach base: config/studies/hypothetical-frontier-lab/context.json
          stipulates customers; factor 1 converts exactly. Historical events
          (data/elicitation_source_cards.yaml, cbrn-source-5 and cbrn-source-6) do not
          establish a program rate per customer.
      derivation: >-
        One base unit per stipulated paying business customer of the lab.
    internal:
      unit: "external pre-release evaluation organization"
      basis: "judgment"
      count:
        kind: "fixed"
        count: 30
        rationale: >-
          External evaluation organizations represent institutional access to not-yet-public
          models relevant to coordinated programs. Stipulate 30 organizations as the reach
          base; the opportunity rate includes programs outside this population. Access does
          not imply hostile intent.
        source: >-
          INITIAL_ESTIMATE: 30 organizations are an authored subset of the external-access
          population in config/studies/hypothetical-frontier-lab/context.json, which
          supplies no organization count or growth scale.
      derivation: "Fixed by the scenario at 30 external pre-release evaluation organizations."
  stages:
    - stage_id: "uplift"
      event: >-
        The model's help gives the program capability, scale or speed that the program would not
        have had without any AI model.
    - stage_id: "harm_or_response"
      event: >-
        The program causes harm or incurs incident-triggered interdiction or response costs.
empirical_grounding: >-
  No governed dataset supports this population. Controlled uplift studies and benchmark results
  describe task performance, not program initiation, interdiction or casualty probabilities.
  Radiological and nuclear security incidents are rare and mostly interdictions.
