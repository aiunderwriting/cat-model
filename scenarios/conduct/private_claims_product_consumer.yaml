id: "private_claims_product_consumer"
name: "Private Claims over Product and Consumer Harm"
node_ids: ["n_claims_product"]
lineage:
  introduced_in: "r1"
description: >-
  A non-government claimant brings a private action or arbitration over the design, safety or
  marketing of the provider's products or its consumer practices, such as a statutory
  consumer-protection class action or a product-design claim, where the defining allegation is the
  practice rather than one discrete incident. A suit over one harmful output follows that incident.
severity_governance:
  policy: "governed_tail_shape"
  tail_class: "liability_enforcement"
  tail_class_rationale: >-
    One private matter's settlement or judgment is bounded by the claims and the provider's balance
    sheet.
  cap_posture: "uncapped"
  evidence_refs: ["assumptions.md#severity-and-tails"]
frequency_semantics:
  counting_identity: >-
    One matter is one unit: one class or representative action, one consolidated, multidistrict or
    coordinated proceeding, or one coordinated mass-arbitration campaign, together with the actions
    merged into it or resolved with it by one global settlement. Court actions are coordinated when
    a court orders them handled together, including by assigning them to one judge as related cases.
    An individual action never consolidated, coordinated or jointly resolved is a separate matter.
    Related claims, plaintiffs, class members, jurisdictions and appeals inside one matter do not
    create more units; a matter naming several labs is one matter across them, each lab's own
    payments and resources forming its loss.
  terminal_event_unit: >-
    One admitted private matter against the selected provider whose defining allegation is unsafe
    product design or unfair consumer practices, over the provider's own development, data, product,
    marketing or disclosure conduct, and {{admission}} over the matter's life. Where a matter pleads
    allegations of more than one kind, among intellectual property, privacy, product or consumer
    harm, and other provider conduct, its defining allegation is the kind that accounts for the
    largest share of its gross loss, and the whole matter belongs to that kind's scenario. A matter
    dismissed after positive defense resources reaching the threshold qualifies. Exclude
    government-initiated actions, claims whose defining allegation is loss from a discrete incident,
    which follow that incident, and ordinary commercial contract disputes. A claim over an attack or
    fraud that used the provider's model without material assistance follows no incident where that
    attack is no scenario's incident, even when it alleges injury or death of identified persons,
    because no counted incident injured them; it is a claim over the provider's own conduct, classed
    by its allegation, normally unsafe product design. Assistance is material when it gives the
    attacker capability, scale or speed that the attacker would not have had without any AI model,
    and the loss, or more than half of it, would not have occurred without that gain. A matter over
    a product or line of business that does not involve the provider's AI models is outside this
    scenario. A claim or enforcement action alleging bodily or psychological injury or death of
    identified persons from the model's outputs follows the incident that injured them, whatever
    theory is pleaded; product and consumer claims, and enforcement, cover matters without such
    injury incidents. An incident below the admission threshold is the unestimated leftover, not
    this scenario's incident.
  year_rule: >-
    A matter is assigned to the year its first loss occurs, normally at its earliest filing or
    written demand; later filings, consolidation, settlement or judgment stay with it.
severity_occurrence_scope: >-
  The complete ultimate gross loss of one private matter across the provider, claimants and
  co-defendants, from first assertion to final resolution: the provider's settlement, judgment and
  fee-award payments; its defense, litigation and remedy-compliance resources; and claimants' and
  co-defendants' litigation resources and co-defendants' payments. Payments to claimants are
  ordinary transfers with zero direct welfare weight. The underlying harm the claims allege is not
  valued by those payments and is outside this estimand. Exclude government fines and enforcement
  resources, forward license fees for future rights, and routine legal operations unchanged by the
  matter.
# The provider is the defendant in private litigation over its own conduct.
facets:
  peril_mechanism: ["private_civil_claim"]
  deployment_control_mode: "api"
  harm_types: ["economic_loss"]
  bearers: ["provider", "third_party_individuals", "third_party_organizations"]
  party_basis: "first_party"
occurrence_unit_id: "private_claims_product_consumer_matter"
attribution_nexus:
  kind: "regulatory_respondent"
  terminal_qualification: >-
    The assigned provider is a named defendant or respondent in the matter, and its own conduct,
    alleged to be unsafe product design or unfair consumer practices, is the defining subject of the
    claims.
estimand_composition:
  roster: "private_claims"
event_chain:
  opportunity:
    unit: >-
      One prospective private matter against the named lab: an identifiable grievance alleging
      unsafe product design or unfair consumer practices, held by a claimant or claimant group such
      as consumers, parents or users, about the named lab's own conduct, before any action is filed.
      Government-initiated actions and claims that follow a counted incident are outside this pool;
      a grievance over an attack or fraud that used the lab's model without material assistance,
      where that attack is no scenario's incident, is inside it.
    counting_rule: >-
      Count one opportunity per grievance that would be pursued as one class, representative,
      consolidated, coordinated or mass-arbitration proceeding, or as one individual action. Each
      yields at most one qualified matter.
    cohort: >-
      Grievances live during the study year that have not produced a filed action or loss in an
      earlier year; membership does not depend on later success.
  exposure:
    public:
      unit: "1 million weekly active users of the consumer assistant"
      basis: "judgment"
      count:
        kind: "derived"
        scale_id: "consumer_weekly_users"
        factor: 1.0e-6
        rationale: "Claimants are consumers, parents and users, whom weekly users measure."
        source: >-
          INITIAL_ESTIMATE: consumer-protection and product class actions against consumer
          technology companies are analogs; no rate per user is published.
      derivation: >-
        The stipulated number of weekly active users of the consumer assistant divided by 1 million.
    internal:
      unit: "1,000 lab staff"
      basis: "normalisation"
      count:
        kind: "derived"
        scale_id: "lab_staff"
        factor: 1.0e-3
        rationale: >-
          Internal and pre-release use has one stipulated scale, lab staff, so the internal rate is
          per 1,000 lab staff, a normalisation: matters over not-yet-public models arise from the
          lab's own conduct, which no stipulated scale measures.
        source: >-
          INITIAL_ESTIMATE: normalisation only; no stipulated scale measures the lab's own conduct.
      derivation: "The stipulated number of lab staff divided by 1,000."
  stages:
    - stage_id: "action_asserted"
      event: >-
        A claimant files a complaint, serves an arbitration demand or pleads a class or
        representative claim against the named lab whose defining allegation is that conduct.
empirical_grounding: >-
  No governed dataset supports this population. Court records and company filings document consumer
  and product actions against AI developers, and consumer-protection class actions against other
  technology companies are analogs. They are selected and incompletely reported, and establish no
  matter count, defense costs or share of actions that end in payment.
