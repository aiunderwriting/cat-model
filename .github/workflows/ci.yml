name: CI

# Every job runs on every pull request, on every push to main and on manual
# dispatch. `ci-green` is the sole required check: it passes only when every
# other job has succeeded.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    # Generous for the full suite, coverage included. The standard runner has
    # 4 cores in a public repository and 2 in a private one.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        # A pull request splits the suite over four jobs for each Python
        # version: `--shard I/N` (tests/conftest.py) runs part I of N, and the
        # parts together run every test once. A push to main or a manual
        # dispatch runs the suite whole, so that the coverage report below
        # covers all of it.
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '[1, 2, 3, 4]' || '[1]') }}
    env:
      SHARDS: ${{ github.event_name == 'pull_request' && 4 || 1 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      # Coverage is diagnostic rather than a merge gate. Pull requests run the
      # full behavioral suite without instrumentation; a push to main collects
      # coverage once on Python 3.14.
      - name: Run tests
        if: ${{ matrix.python-version != '3.14' || github.event_name != 'push' || github.ref != 'refs/heads/main' }}
        run: uv run pytest -n auto --shard "${{ matrix.shard }}/$SHARDS" --durations=25 -q

      - name: Run tests with coverage
        if: ${{ matrix.python-version == '3.14' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: uv run pytest -n auto --durations=25 --cov=catmodel --cov-branch --cov-report=term-missing --cov-report=json:coverage.json -q

      - name: Upload diagnostic coverage
        if: ${{ !cancelled() && matrix.python-version == '3.14' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.json
          if-no-files-found: warn
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          # uv's default Python is 3.15, for which not every locked package
          # publishes a wheel.
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff linter
        run: uv run ruff check

      - name: Run Ruff formatter check
        run: uv run ruff format --check

      - name: Run import boundary contracts
        run: uv run lint-imports

      - name: Check dependency pins
        run: uv run python scripts/check_dependency_pins.py

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          # uv's default Python is 3.15, for which not every locked package
          # publishes a wheel.
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ty
        run: uv run ty check

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          python-version: "3.13"

      - name: Audit Python lockfiles
        run: uv audit --preview-features audit-command --frozen

  # The release artifact smoke test is part of the required ci-green gate.
  # A job that calls a reusable workflow takes no timeout; the called job sets one.
  release-artifact:
    uses: ./.github/workflows/release.yml

  # always() runs this job when another job has failed or been cancelled;
  # without it the job would be skipped, and a skipped required check does not
  # block a merge.
  ci-green:
    needs:
      - tests
      - lint
      - typecheck
      - audit
      - release-artifact
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          bad = sorted(
              name for name, meta in needs.items() if meta.get("result") != "success"
          )
          width = max(len(name) for name in needs)
          for name in sorted(needs):
              print(f"{name:<{width}}  {needs[name].get('result')}")
          if bad:
              print("\nJobs that did not succeed: " + ", ".join(bad))
              sys.exit(1)
          print("\nEvery job succeeded.")
          PY
