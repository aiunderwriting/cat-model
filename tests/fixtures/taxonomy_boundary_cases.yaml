    - subject: The teenager's USD 10 million of injury loss.
      facts:
        origin_regime: ai_failure
        failure_role: harmful_engagement
      terminal_id: n_failure_engagement_harm
      scenario_id: engagement_harm
      incident_id: memory_feature
      loss_id: teen_injury
      gross_amount_usd: 10000000
      economic_nature: injury_valuation
    - subject: The wrongful-death suit's USD 2 million of legal resources.
      facts:
        origin_regime: ai_failure
        failure_role: harmful_engagement
      terminal_id: n_failure_engagement_harm
      scenario_id: engagement_harm
      incident_id: memory_feature
      loss_id: teen_suit
      gross_amount_usd: 2000000
      economic_nature: resource_cost
    - subject: The forty children's USD 120 million of injury loss.
      facts:
        origin_regime: ai_failure
        failure_role: harmful_engagement
      terminal_id: n_failure_engagement_harm
      scenario_id: engagement_harm
      incident_id: memory_feature
      loss_id: other_injuries
      gross_amount_usd: 120000000
      economic_nature: injury_valuation
    - subject: The coordinated suits' USD 15 million of legal resources.
      facts:
        origin_regime: ai_failure
        failure_role: harmful_engagement
      terminal_id: n_failure_engagement_harm
      scenario_id: engagement_harm
      incident_id: memory_feature
      loss_id: other_suits
      gross_amount_usd: 15000000
      economic_nature: resource_cost
    admitted:
      memory_feature: true
    identity_note: 'A specific, correctable property of one model version is acknowledged to cause the
