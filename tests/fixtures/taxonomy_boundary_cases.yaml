evidence_kind: authored_examples
limitations: Synthetic cases, not observed incidents, empirical calibration, or proof of economy-wide
  coverage. All amounts and facts are illustrative. Expected answers express the current accounting convention;
  independent readers should initially receive only the prompt sections.
review_task: 'Using the current hierarchy and scenario definitions, identify each incident (one root cause,
  campaign, defect or matter), assign the whole incident with all its losses to the leaf of the process
  that caused most of its loss, and decide whether it is admitted: gross loss across all parties before
  recovery of at least USD 100,000. Where a history has a model help an attacker and says nothing more,
  treat the help as material (convention 7). State missing facts as unresolved, never as an other
  branch.'
cases:
- id: phishing_written_ransomware_human
  prompt:
    history: An attacker who cannot write in the victims' language, and has no other means of producing a
      convincing email, uses a model only to write a phishing email, and the intrusion depends on that
      email. A human-written ransomware then encrypts the victim company's systems. The company spends USD
      6 million restoring operations and pays a USD 2 million ransom.
    subjects:
    - The USD 6 million restoration and interruption.
    - The USD 2 million ransom.
  expected:
    classifications:
    - subject: The USD 6 million restoration and interruption.
      facts:
        origin_regime: deliberate_misuse
        misuse_role: assisted_attacker
        loss_process: system_compromise
        compromise_target: other_organizations
      terminal_id: n_compromise_organizations
      scenario_id: compromise_organizations
      incident_id: ransomware
      loss_id: restoration
      gross_amount_usd: 6000000
      economic_nature: resource_cost
    - subject: The USD 2 million ransom.
      facts:
        origin_regime: deliberate_misuse
        misuse_role: assisted_attacker
        loss_process: system_compromise
        compromise_target: other_organizations
      terminal_id: n_compromise_organizations
      scenario_id: compromise_organizations
      incident_id: ransomware
      loss_id: ransom
      gross_amount_usd: 2000000
      economic_nature: appropriated_transfer
    admitted:
      ransomware: true
    identity_note: Encryption is the process that caused the loss; the AI-written phishing is a tactic
      of system compromise, not fraud. The email is material assistance, because the attacker would not
      have had a convincing one without an AI model and the loss would not have occurred without it.
    accounting:
      unique_gross_usd: 8000000
      unique_incident_count: 1
      admitted_scenario_incident_counts:
        compromise_organizations: 1
