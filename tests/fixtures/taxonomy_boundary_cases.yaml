- id: worm_and_vendor_update
  prompt:
    history: 'Two separate campaigns each hit about 2,000 organizations outside critical infrastructure:
      an organized-crime group uses a model to build a self-propagating worm on a known exploit (USD 400
      million of loss), and another group uses a model to compromise a shared dependency and push a malicious
      vendor update (USD 600 million).'
    subjects:
    - The worm campaign's USD 400 million.
    - The vendor-update campaign's USD 600 million.
  expected:
    classifications:
    - subject: The worm campaign's USD 400 million.
      facts:
        origin_regime: deliberate_misuse
        misuse_role: assisted_attacker
        loss_process: system_compromise
        compromise_target: any_reachable
      terminal_id: n_compromise_self_propagating
      scenario_id: compromise_self_propagating
      incident_id: worm
      loss_id: worm
      gross_amount_usd: 400000000
      economic_nature: resource_cost
    - subject: The vendor-update campaign's USD 600 million.
      facts:
        origin_regime: deliberate_misuse
        misuse_role: assisted_attacker
        loss_process: system_compromise
        compromise_target: other_organizations
      terminal_id: n_compromise_organizations
      scenario_id: compromise_organizations
      incident_id: vendor
      loss_id: vendor
      gross_amount_usd: 600000000
      economic_nature: resource_cost
    admitted:
      vendor: true
      worm: true
    identity_note: 'How the attack spreads is a split and how far is not: the worm''s code spreads on its
      own to any system it can reach, so it is a self-propagating compromise, and the attacker distributes
      the vendor update to chosen organizations, so that campaign is directed at them. Each is one
      incident, its reach part of severity.'
    accounting:
      unique_gross_usd: 1000000000
      unique_incident_count: 2
      admitted_scenario_incident_counts:
        compromise_organizations: 1
        compromise_self_propagating: 1
