- id: state_action_over_several_injury_incidents
  prompt:
    history: Three teenagers harm themselves after months of conversations with a chatbot; no specific,
      correctable model, version, feature or configuration property is shown or acknowledged to cause
      the harms, so each is a separate engagement-harm incident. A state attorney general then sues the
      provider under a consumer-protection statute over the chatbot's engagement design and marketing,
      a practice that began in 2027, and cites the three teenagers' injuries. The action ends with a
      civil penalty of USD 40 million and costs the provider USD 5 million in legal resources.
    subjects:
    - The USD 40 million civil penalty.
    - The USD 5 million of legal resources spent on the state's action.
  expected:
    classifications:
    - subject: The USD 40 million civil penalty.
      facts:
        origin_regime: provider_conduct
        conduct_process: enforcement
      terminal_id: n_conduct_enforcement
      scenario_id: enforcement_matter
      incident_id: state_action
      loss_id: penalty
      gross_amount_usd: 40000000
      economic_nature: transfer
    - subject: The USD 5 million of legal resources spent on the state's action.
      facts:
        origin_regime: provider_conduct
        conduct_process: enforcement
      terminal_id: n_conduct_enforcement
      scenario_id: enforcement_matter
      incident_id: state_action
      loss_id: state_action_legal
      gross_amount_usd: 5000000
      economic_nature: resource_cost
    admitted:
      state_action: true
    identity_note: One enforcement action over a practice that cites injuries from several separately
      counted incidents is one enforcement matter, and its penalty and costs are part of none of those
      incidents. An action over the injuries of one incident would follow that incident, and each
      family's own claim still follows the incident that injured its child.
    accounting:
      unique_gross_usd: 45000000
      unique_incident_count: 1
      admitted_scenario_incident_counts:
        enforcement_matter: 1
    matter_year: 2027
- id: model_used_without_gain
  prompt:
    history: A crew that has run payment-diversion fraud for years uses a model only to tidy the wording
      of emails it writes itself, and a company pays USD 2 million to a false payee. The company sues the
      model's provider for failing to stop the misuse; the provider spends USD 600,000 defending the
      claim, which is dismissed.
    subjects:
    - The USD 600,000 defense.
  expected:
    classifications:
    - subject: The USD 600,000 defense.
      facts:
        origin_regime: provider_conduct
        conduct_process: private_claim
        claim_allegation: product_consumer_harm
      terminal_id: n_claims_product
      scenario_id: private_claims_product_consumer
      incident_id: misuse_suit
      loss_id: misuse_suit_defense
      gross_amount_usd: 600000
      economic_nature: resource_cost
    admitted:
      misuse_suit: true
    identity_note: The model gave the crew no gain in capability, scale or speed that the loss depended
      on, so its assistance was not material; the fraud is no leaf's incident, other origin included,
      and its USD 2 million is not counted. The suit therefore follows no incident and is a claim over
      the provider's own conduct, here the safety of its product.
    accounting:
      unique_gross_usd: 600000
      unique_incident_count: 1
      admitted_scenario_incident_counts:
        private_claims_product_consumer: 1
- id: another_model_could_have_helped
  prompt:
    history: A crew with no programmer uses a copy of the provider's model to write ransomware that it
      could not have written itself and would not have bought or rented; an open model from another
      developer could have written it as well.
      The ransomware encrypts a company's systems, and restoring them costs USD 4 million.
    subjects:
    - The USD 4 million restoration.
  expected:
    classifications:
    - subject: The USD 4 million restoration.
      facts:
        origin_regime: deliberate_misuse
        misuse_role: assisted_attacker
        loss_process: system_compromise
        compromise_target: other_organizations
      terminal_id: n_compromise_organizations
      scenario_id: compromise_organizations
      incident_id: crew_ransomware
      loss_id: crew_ransomware_restoration
      gross_amount_usd: 4000000
      economic_nature: resource_cost
    admitted:
      crew_ransomware: true
    identity_note: The comparison is with what the crew would have had with no generative AI model of
